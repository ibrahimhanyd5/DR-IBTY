#boot{position:fixed;inset:0;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;font:16px Tajawal,sans-serif;color:#6b7280;background:#dcdfe4;z-index:50}

<body class="antialiased overflow-hidden select-none">
<div id="root"></div>
<div id="boot"><div>جارٍ تجهيز التطبيق…</div><small id="bootmsg">أول فتح قد يستغرق بضع ثوانٍ</small></div>
<div id="err"></div>
<script>
(function(){
var LIST=["src/App.tsx", "src/components/AIAssistant.tsx", "src/components/AIDialog.tsx", "src/components/CanvaSidebar.tsx", "src/components/DesignAuditOverlay.tsx", "src/components/DeveloperTemplateModal.tsx", "src/components/FrameInspector.tsx", "src/components/IconBrowser.tsx", "src/components/LayoutGridModal.tsx", "src/components/NewDocModal.tsx", "src/components/PagesPanel.tsx", "src/components/StagePanBars.tsx", "src/main.tsx", "src/services/aiClient.ts", "src/services/designAuditor.ts", "src/services/exporters.ts", "src/services/i18n.ts", "src/services/iconsFonts.ts", "src/services/imageProcessing.ts", "src/services/multiUserSync.ts", "src/services/stockMedia.ts", "src/services/storage.ts", "src/services/templatesData.ts", "src/services/textLayout.ts", "src/types/printStudio.ts"];
function fail(e){var d=document.getElementById('err');d.style.display='block';d.textContent='Error: '+(e&&e.stack||e)}
window.addEventListener('error',function(ev){if(!window.__ok)fail(ev.error||ev.message)});
function hash(s){var h=5381;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36)}
async function main(){
 var texts=await Promise.all(LIST.map(function(f){return fetch(f).then(function(r){if(!r.ok)throw new Error('تعذر تحميل '+f+' ('+r.status+')');return r.text()})}));
 var FILES={};LIST.forEach(function(f,i){FILES[f]=texts[i]});
 var key=hash(texts.join('\u0000')),cs=null,compiled=null,url=location.origin+'/__ps_cache/'+key;
 try{cs=await caches.open('ps-js');var hit=await cs.match(url);if(hit)compiled=await hit.json()}catch(e){}
 if(!compiled){
  compiled={};
  LIST.forEach(function(p){compiled[p]=Babel.transform(FILES[p],{filename:p,sourceType:'module',presets:[['typescript',{isTSX:p.endsWith('.tsx'),allExtensions:true}],['react',{runtime:'automatic'}]],plugins:['transform-modules-commonjs']}).code});
  try{if(cs){(await cs.keys()).forEach(function(k){cs.delete(k)});await cs.put(url,new Response(JSON.stringify(compiled)))}}catch(e){}
 }
 var cache={};
 var jsx=function(t,p,k){var c=p.children,r={};for(var x in p)if(x!=='children')r[x]=p[x];if(k!==undefined)r.key=k;return c===undefined?React.createElement(t,r):React.createElement(t,r,c)};
 var jsxs=function(t,p,k){var c=p.children,r={};for(var x in p)if(x!=='children')r[x]=p[x];if(k!==undefined)r.key=k;return React.createElement.apply(null,[t,r].concat(c))};
 var EXT={'react':React,'react-dom/client':ReactDOM,'react/jsx-runtime':{jsx:jsx,jsxs:jsxs,Fragment:React.Fragment},'react/jsx-dev-runtime':{jsxDEV:jsx,jsx:jsx,jsxs:jsxs,Fragment:React.Fragment}};
 function norm(p){var o=[];p.split('/').forEach(function(s){if(s==='..')o.pop();else if(s&&s!=='.')o.push(s)});return o.join('/')}
 function resolve(from,req){var b=norm(from.split('/').slice(0,-1).join('/')+'/'+req);var c=[b,b+'.tsx',b+'.ts',b+'/index.tsx'];for(var i=0;i<c.length;i++)if(compiled[c[i]]!==undefined)return c[i];return null}
 function load(path){if(cache[path])return cache[path].exports;var m={exports:{}};cache[path]=m;
  var req=function(r){if(EXT[r])return EXT[r];if(/\.css$/.test(r))return {};var p=resolve(path,r);if(!p)throw new Error('Module not found: '+r+' from '+path);return load(p)};
  new Function('require','module','exports',compiled[path])(req,m,m.exports);return m.exports}
 load('src/main.tsx');window.__ok=1;document.getElementById('boot').remove();
}
main().catch(fail);
})();
</script>
</body>
</html>
