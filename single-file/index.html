"\n                  />\n                  <span className=\"text-[10px] text-[var(--mut)]\">مم<\/span>\n                <\/div>\n              <\/div>\n\n              <div>\n                <label className=\"text-[11px] text-[var(--mut)] block mb-1\">{isAr ? 'خارجي (Outside):' : 'Outside:'}<\/label>\n                <div className=\"flex items-center gap-1\">\n                  <input\n                    type=\"number\"\n                    min=\"0\"\n                    max=\"60\"\n                    value={marginOutside}\n                    onChange={(e) => {\n                      const v = +e.target.value;\n                      if (linkMargins) updateAllMargins(v);\n                      else setMarginOutside(v);\n                    }}\n                    className=\"ps-input w-full text-xs font-semibold text-center\"\n                  />\n                  <span className=\"text-[10px] text-[var(--mut)]\">مم<\/span>\n                <\/div>\n              <\/div>\n            <\/div>\n          <\/div>\n        <\/div>\n\n        {/* Footer */}\n        <div className=\"px-5 py-3 border-t border-[var(--bd)] bg-[var(--row)] flex items-center justify-end gap-2\">\n          <button className=\"ps-btn text-xs py-1.5 px-3\" onClick={onClose}>\n            {isAr ? 'إلغاء' : 'Cancel'}\n          <\/button>\n          <button className=\"ps-btn ps-btn-primary text-xs py-1.5 px-5 font-bold\" onClick={handleApply}>\n            {isAr ? 'تطبيق التخطيط والهوامش ✔' : 'Apply Layout ✔'}\n          <\/button>\n        <\/div>\n      <\/div>\n    <\/div>\n  );\n}\n", "src/components/AIDialog.tsx": "/**\n * @license\n * SPDX-License-Identifier: Apache-2.0\n */\n\nimport React, { useState } from 'react';\nimport { Item } from '../types/printStudio';\nimport {\n  removeBackgroundClient,\n  applyImageFilter,\n  splitImageIntoSlices,\n  transformToCartoon,\n  generateCartoonArtwork,\n} from '../services/imageProcessing';\n\ninterface AIDialogProps {\n  item: Item;\n  imageDataUrl?: string;\n  onUpdateItem: (updates: Partial<Item>) => void;\n  onUpdateImage: (key: string, dataUrl: string) => void;\n  onAddMultipleItems: (items: Item[], images: Record<string, string>) => void;\n  onClose: () => void;\n  toast: (msg: string) => void;\n  lang?: 'ar' | 'en';\n}\n\ninterface StagedAction {\n  type: 'text' | 'image' | 'color' | 'slices';\n  summary: string;\n  previewData?: {\n    originalText?: string;\n    newText?: string;\n    imageThumbnail?: string;\n    colorSwatch?: string;\n    slicesCount?: number;\n  };\n  apply: () => void;\n}\n\ninterface ChatMessage {\n  id: string;\n  sender: 'ai' | 'user';\n  text: string;\n  stagedAction?: StagedAction;\n}\n\nexport function AIDialog({\n  item,\n  imageDataUrl,\n  onUpdateItem,\n  onUpdateImage,\n  onAddMultipleItems,\n  onClose,\n  toast,\n  lang = 'ar',\n}: AIDialogProps) {\n  const [input, setInput] = useState('');\n  const [loading, setLoading] = useState(false);\n  const [stagedAction, setStagedAction] = useState<StagedAction | null>(null);\n\n  const isAr = lang === 'ar';\n\n  const [messages, setMessages] = useState<ChatMessage[]>(() => [\n    {\n      id: 'init',\n      sender: 'ai',\n      text: isAr\n        ? `مرحباً! أنا مساعد الذكاء الاصطناعي الخاص بالعنصر (${\n            item.type === 'text' ? 'نص' : item.type === 'img' ? 'صورة' : 'شكل'\n          }). أي تعديل ستطلبه سيتم تجهيزه ومعاينته هنا أولاً، ثم سأسألك للتأكيد قبل تطبيقه على التصميم.`\n        : `Hello! I'm your AI assistant for this ${item.type}. I will stage and preview any modification here first, then ask for your confirmation before applying it to the canvas.`,\n    },\n  ]);\n\n  const handleSend = async (userPrompt?: string) => {\n    const textToSend = userPrompt || input.trim();\n    if (!textToSend || loading) return;\n\n    setInput('');\n    const userMsg: ChatMessage = {\n      id: String(Date.now()),\n      sender: 'user',\n      text: textToSend,\n    };\n    setMessages((prev) => [...prev, userMsg]);\n    setLoading(true);\n\n    try {\n      const lower = textToSend.toLowerCase();\n\n      // 1. Remove Background\n      if (\n        item.type === 'img' &&\n        (lower.includes('خلفية') ||\n          lower.includes('عزل') ||\n          lower.includes('تفريغ') ||\n          lower.includes('background') ||\n          lower.includes('cutout'))\n      ) {\n        if (!imageDataUrl || !item.k) throw new Error(isAr ? 'لا تتوفر صورة' : 'No image available');\n\n        const transparentDataUrl = await removeBackgroundClient(imageDataUrl);\n        const action: StagedAction = {\n          type: 'image',\n          summary: isAr ? 'عزل وحذف خلفية الصورة' : 'Remove background',\n          previewData: {\n            imageThumbnail: transparentDataUrl,\n          },\n          apply: () => {\n            onUpdateImage(item.k!, transparentDataUrl);\n          },\n        };\n\n        setStagedAction(action);\n        setMessages((prev) => [\n          ...prev,\n          {\n            id: String(Date.now() + 1),\n            sender: 'ai',\n            text: isAr\n              ? '✨ تم تجهيز عزل الخلفية بنجاح في المعاينة أدناه. هل أطبق هذا التعديل على التصميم؟'\n              : '✨ Background cutout prepared below! Shall I apply it to your canvas?',\n            stagedAction: action,\n          },\n        ]);\n      }\n\n      // 2. Magic Slices Tool\n      else if (\n        item.type === 'img' &&\n        (lower.includes('شرائح') ||\n          lower.includes('قسم') ||\n          lower.includes('سلايس') ||\n          lower.includes('slice'))\n      ) {\n        if (!imageDataUrl) throw new Error(isAr ? 'لا تتوفر صورة للتقسيم' : 'No image to slice');\n        const rows = lower.includes('3') ? 3 : 2;\n        const cols = lower.includes('3') ? 3 : 2;\n        const result = await splitImageIntoSlices(item, imageDataUrl, rows, cols);\n\n        const action: StagedAction = {\n          type: 'slices',\n          summary: isAr ? `تقسيم الصورة إلى ${rows * cols} شرائح سحرية` : `Split into ${rows * cols} slices`,\n          previewData: {\n            slicesCount: rows * cols,\n          },\n          apply: () => {\n            onAddMultipleItems(result.newItems, result.newImages);\n          },\n        };\n\n        setStagedAction(action);\n        setMessages((prev) => [\n          ...prev,\n          {\n            id: String(Date.now() + 1),\n            sender: 'ai',\n            text: isAr\n              ? `✂️ تم تجهيز ${rows * cols} شرائح سحرية متفرقة كطبقات مستقلة. هل أطبق التقسيم على التصميم؟`\n              : `✂️ Prepared ${rows * cols} slices ready as layers. Shall I apply to canvas?`,\n            stagedAction: action,\n          },\n        ]);\n      }\n\n      // 3. Cartoon / Anime / Comic Generation & Transformation\n      else if (\n        lower.includes('كارتون') ||\n        lower.includes('كرتون') ||\n        lower.includes('كرتونية') ||\n        lower.includes('كارتونية') ||\n        lower.includes('رسوم') ||\n        lower.includes('رسم') ||\n        lower.includes('انمي') ||\n        lower.includes('أنمي') ||\n        lower.includes('cartoon') ||\n        lower.includes('anime') ||\n        lower.includes('comic') ||\n        lower.includes('كوميك')\n      ) {\n        let cartoonDataUrl = '';\n        const wantsTransformCurrent =\n          item.type === 'img' &&\n          imageDataUrl &&\n          (lower.includes('حول') || lower.includes('تأثير') || lower.includes('فلتر') || lower.includes('convert'));\n\n        if (wantsTransformCurrent && imageDataUrl) {\n          cartoonDataUrl = await transformToCartoon(imageDataUrl, 26, 5);\n        } else {\n          // Generate customized vibrant cartoon artwork\n          cartoonDataUrl = await generateCartoonArtwork(textToSend);\n        }\n\n        const action: StagedAction = {\n          type: 'image',\n          summary: isAr ? 'رسم وصورة كارتونية مخصصة (AI Cartoon)' : 'Cartoon Cel-Shading Artwork',\n          previewData: {\n            imageThumbnail: cartoonDataUrl,\n          },\n          apply: () => {\n            if (item.type === 'img' && item.k) {\n              onUpdateImage(item.k, cartoonDataUrl);\n            } else {\n              const newKey = 'i' + Date.now();\n              onUpdateImage(newKey, cartoonDataUrl);\n              onAddMultipleItems(\n                [\n                  {\n                    id: Date.now(),\n                    type: 'img',\n                    k: newKey,\n                    name: isAr ? 'شخصية ورسم كارتوني' : 'Cartoon Artwork',\n                    x: Math.max(20, Math.min(300, (item.x || 40))),\n                    y: Math.max(20, Math.min(400, (item.y || 40) + (item.h || 60) + 10)),\n                    w: 280,\n                    h: 280,\n                  },\n                ],\n                { [newKey]: cartoonDataUrl }\n              );\n            }\n          },\n        };\n\n        setStagedAction(action);\n        setMessages((prev) => [\n          ...prev,\n          {\n            id: String(Date.now() + 1),\n            sender: 'ai',\n            text: isAr\n              ? '🎭 تم تجهيز وتوليد الصورة الكرتونية بنجاح (Cartoon Cel-Shading Artwork)! عاين النتيجة أدناه، هل ترغب في تطبيقها على التصميم؟'\n              : '🎭 Cartoon illustration generated successfully below! Would you like to apply it to your canvas?',\n            stagedAction: action,\n          },\n        ]);\n        toast(isAr ? 'تم تجهيز الصورة الكرتونية ✨' : 'Cartoon ready ✨');\n      }\n\n      // 4. Colorize / Filters\n      else if (\n        item.type === 'img' &&\n        (lower.includes('لون') ||\n          lower.includes('فلتر') ||\n          lower.includes('ابيض') ||\n          lower.includes('دافئ') ||\n          lower.includes('سينمائي') ||\n          lower.includes('filter'))\n      ) {\n        if (!imageDataUrl || !item.k) throw new Error(isAr ? 'لا توجد صورة' : 'No image');\n        let filter: 'grayscale' | 'duotone' | 'warm' | 'cool' | 'vintage' | 'vibrant' = 'vintage';\n        if (lower.includes('ابيض') || lower.includes('اسود') || lower.includes('رمادي') || lower.includes('bw'))\n          filter = 'grayscale';\n        else if (lower.includes('دافئ') || lower.includes('warm')) filter = 'warm';\n        else if (lower.includes('بارد') || lower.includes('cool')) filter = 'cool';\n        else if (lower.includes('حيوي') || lower.includes('vibrant')) filter = 'vibrant';\n        else if (lower.includes('دويتون') || lower.includes('duotone')) filter = 'duotone';\n\n        const filtered = await applyImageFilter(imageDataUrl, filter);\n        const action: StagedAction = {\n          type: 'image',\n          summary: isAr ? `تطبيق فلتر (${filter})` : `Apply (${filter}) filter`,\n          previewData: {\n            imageThumbnail: filtered,\n          },\n          apply: () => {\n            onUpdateImage(item.k!, filtered);\n          },\n        };\n\n        setStagedAction(action);\n        setMessages((prev) => [\n          ...prev,\n          {\n            id: String(Date.now() + 1),\n            sender: 'ai',\n            text: isAr\n              ? `🎨 تم تجهيز فلتر النمط (${filter}) للمعاينة. هل ترغب بتطبيقه على التصميم؟`\n              : `🎨 Prepared (${filter}) filter in preview. Apply to canvas?`,\n            stagedAction: action,\n          },\n        ]);\n      }\n\n      // 4. Text Rewriting & Enhancements\n      else if (item.type === 'text') {\n        const currentText = item.text || '';\n        let proposedText = currentText;\n\n        if (lower.includes('تسويق') || lower.includes('marketing') || lower.includes('جذب')) {\n          proposedText = isAr\n            ? `✨ ${currentText.replace(/^[✨\\s]+/, '')} — الحل الأمثل لابتكار استثنائي وتجربة لا تُنسى`\n            : `✨ ${currentText} — Elevate your brand with precision and impact`;\n        } else if (lower.includes('اختصر') || lower.includes('short') || lower.includes('قصير')) {\n          proposedText = currentText.split('\\n')[0].split(' ').slice(0, 5).join(' ');\n        } else if (lower.includes('صحفي') || lower.includes('journalism') || lower.includes('مانشيت')) {\n          proposedText = isAr ? `تقرير خاص وموسع: ${currentText}` : `Special Report: ${currentText}`;\n        } else if (lower.includes('تدقيق') || lower.includes('grammar') || lower.includes('نحو')) {\n          proposedText = currentText.replace(/إ/g, 'إ').replace(/ى/g, 'ي').trim();\n        } else {\n          proposedText = isAr ? `${currentText} | تميز ملهم وإبداع متجدد` : `${currentText} | Inspiring Excellence`;\n        }\n\n        const action: StagedAction = {\n          type: 'text',\n          summary: isAr ? 'إعادة صياغة النص' : 'Rewrite text',\n          previewData: {\n            originalText: currentText,\n            newText: proposedText,\n          },\n          apply: () => {\n            onUpdateItem({ text: proposedText });\n          },\n        };\n\n        setStagedAction(action);\n        setMessages((prev) => [\n          ...prev,\n          {\n            id: String(Date.now() + 1),\n            sender: 'ai',\n            text: isAr\n              ? '✍️ تم اقتراح الصياغة الجديدة أدناه. هل أعتمدها وأطبقها على التصميم؟'\n              : '✍️ Proposed phrasing generated below. Apply to canvas?',\n            stagedAction: action,\n          },\n        ]);\n      }\n\n      // 5. Shapes / Colors\n      else {\n        const palette = ['#d81b79', '#0284c7', '#10b981', '#f59e0b', '#8b5cf6', '#0f172a'];\n        const chosen = palette[Math.floor(Math.random() * palette.length)];\n        const action: StagedAction = {\n          type: 'color',\n          summary: isAr ? `تغيير اللون إلى ${chosen}` : `Change color to ${chosen}`,\n          previewData: {\n            colorSwatch: chosen,\n          },\n          apply: () => {\n            onUpdateItem({ color: chosen });\n          },\n        };\n\n        setStagedAction(action);\n        setMessages((prev) => [\n          ...prev,\n          {\n            id: String(Date.now() + 1),\n            sender: 'ai',\n            text: isAr\n              ? `🎨 تم اختيار اللون المقترح (${chosen}). هل أطبقه على العنصر في التصميم؟`\n              : `🎨 Suggested color (${chosen}) ready. Apply to canvas?`,\n            stagedAction: action,\n          },\n        ]);\n      }\n    } catch (err: any) {\n      setMessages((prev) => [\n        ...prev,\n        {\n          id: String(Date.now() + 1),\n          sender: 'ai',\n          text: `⚠️ ${err?.message || (isAr ? 'تعذر معالجة الطلب' : 'Failed to process request')}`,\n        },\n      ]);\n    } finally {\n      setLoading(false);\n    }\n  };\n\n  const confirmStagedAction = () => {\n    if (!stagedAction) return;\n    stagedAction.apply();\n    setMessages((prev) => [\n      ...prev,\n      {\n        id: String(Date.now()),\n        sender: 'ai',\n        text: isAr ? '✅ تم تطبيق التعديل على التصميم بنجاح!' : '✅ Modification applied to canvas!',\n      },\n    ]);\n    setStagedAction(null);\n    toast(isAr ? 'تم تطبيق التعديل بنجاح' : 'Applied successfully');\n  };\n\n  const cancelStagedAction = () => {\n    setStagedAction(null);\n    setMessages((prev) => [\n      ...prev,\n      {\n        id: String(Date.now()),\n        sender: 'ai',\n        text: isAr ? '❌ تم إلغاء التعديل والاحتفاظ بالحالة السابقة.' : '❌ Discarded. Previous state kept.',\n      },\n    ]);\n  };\n\n  return (\n    <div className=\"flex flex-col h-[500px] max-h-[75vh]\">\n      {/* Header Info */}\n      <div className=\"flex items-center justify-between pb-3 border-b border-[var(--bd)] text-xs text-[var(--mut)]\">\n        <div className=\"flex items-center gap-1.5 font-semibold text-[var(--fg)]\">\n          <span className=\"w-2 h-2 rounded-full bg-blue-500 animate-pulse\" />\n          <span>{isAr ? 'مساعد الذكاء الاصطناعي مع تأكيد المعاينة' : 'AI Assistant with Preview Confirm'}<\/span>\n        <\/div>\n        <span>\n          #{item.id} ({item.type})\n        <\/span>\n      <\/div>\n\n      {/* Messages Scroll Area */}\n      <div className=\"flex-1 overflow-y-auto py-3 space-y-3 pr-1\">\n        {messages.map((m) => (\n          <div key={m.id} className={`flex flex-col ${m.sender === 'user' ? 'items-start' : 'items-end'}`}>\n            <div\n              className={`max-w-[90%] rounded-2xl px-3.5 py-2.5 text-xs leading-relaxed space-y-2 ${\n                m.sender === 'user'\n                  ? 'bg-[var(--ac)] text-[var(--acf)] rounded-tr-sm'\n                  : 'bg-[var(--row)] text-[var(--fg)] border border-[var(--bd)] rounded-tl-sm'\n              }`}\n            >\n              <div>{m.text}<\/div>\n\n              {/* In-box Visual Preview */}\n              {m.stagedAction && (\n                <div className=\"mt-2 p-2.5 rounded-xl bg-[var(--bar)] border border-[var(--bd)] space-y-2\">\n                  <div className=\"text-[11px] font-bold text-[var(--mut)]\">\n                    {isAr ? 'معاينة التعديل المقترح:' : 'Proposed Edit Preview:'}\n                  <\/div>\n\n                  {/* Text Before/After */}\n                  {m.stagedAction.previewData?.newText && (\n                    <div className=\"space-y-1 text-xs\">\n                      <div className=\"text-[10px] text-rose-500 line-through opacity-75\">\n                        {m.stagedAction.previewData.originalText}\n                      <\/div>\n                      <div className=\"font-semibold text-emerald-600 bg-emerald-500/10 p-1.5 rounded-lg border border-emerald-500/20\">\n                        {m.stagedAction.previewData.newText}\n                      <\/div>\n                    <\/div>\n                  )}\n\n                  {/* Image Thumbnail */}\n                  {m.stagedAction.previewData?.imageThumbnail && (\n                    <div className=\"flex justify-center p-1 bg-black/5 rounded-lg\">\n                      <img\n                        src={m.stagedAction.previewData.imageThumbnail}\n                        alt=\"Preview\"\n                        className=\"h-24 max-w-full object-contain rounded\"\n                      />\n                    <\/div>\n                  )}\n\n                  {/* Slices Info */}\n                  {m.stagedAction.previewData?.slicesCount && (\n                    <div className=\"text-xs font-semibold text-[var(--ac)]\">\n                      {isAr\n                        ? `✂️ شبكة مقسمة إلى ${m.stagedAction.previewData.slicesCount} طبقات منفصلة`\n                        : `✂️ Split grid into ${m.stagedAction.previewData.slicesCount} layers`}\n                    <\/div>\n                  )}\n\n                  {/* Color Swatch */}\n                  {m.stagedAction.previewData?.colorSwatch && (\n                    <div className=\"flex items-center gap-2\">\n                      <span\n                        className=\"w-6 h-6 rounded-md border border-[var(--bd)] shadow-sm\"\n                        style={{ background: m.stagedAction.previewData.colorSwatch }}\n                      />\n                      <span className=\"text-xs font-mono\">{m.stagedAction.previewData.colorSwatch}<\/span>\n                    <\/div>\n                  )}\n                <\/div>\n              )}\n            <\/div>\n          <\/div>\n        ))}\n\n        {loading && (\n          <div className=\"flex items-center gap-2 text-xs text-[var(--mut)] py-1\">\n            <span className=\"inline-block w-3.5 h-3.5 border-2 border-[var(--ac)] border-t-transparent rounded-full animate-spin\" />\n            <span>{isAr ? 'الذكاء الاصطناعي يجهز المعاينة في البوكس...' : 'AI generating preview...'}<\/span>\n          <\/div>\n        )}\n      <\/div>\n\n      {/* Confirmation Staging Bar (YES / NO) */}\n      {stagedAction && (\n        <div className=\"p-2.5 rounded-xl bg-blue-500/10 border border-blue-500/30 flex items-center justify-between gap-2 mb-2 animate-in slide-in-from-bottom-2\">\n          <div className=\"text-xs font-bold text-blue-700 dark:text-blue-300 truncate\">\n            {isAr ? 'هل أطبق التعديل على التصميم؟' : 'Apply to canvas?'}\n          <\/div>\n          <div className=\"flex items-center gap-2 shrink-0\">\n            <button\n              onClick={confirmStagedAction}\n              className=\"px-3 py-1 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-bold shadow-sm\"\n            >\n              {isAr ? '✅ نعم، تطبيق' : '✅ Yes, Apply'}\n            <\/button>\n            <button\n              onClick={cancelStagedAction}\n              className=\"px-3 py-1 bg-rose-600 hover:bg-rose-700 text-white rounded-lg text-xs font-bold shadow-sm\"\n            >\n              {isAr ? '❌ لا، إلغاء' : '❌ No, Cancel'}\n            <\/button>\n          <\/div>\n        <\/div>\n      )}\n\n      {/* Quick Action Chips */}\n      <div className=\"py-2 flex items-center gap-1.5 overflow-x-auto border-t border-[var(--bd)] scrollbar-none\">\n        {item.type === 'img' && (\n          <>\n            <button\n              className=\"ps-btn text-[11px] py-1 px-2.5 rounded-full bg-gradient-to-r from-orange-500/15 to-amber-500/15 text-orange-600 border border-orange-400/30 font-bold\"\n              onClick={() => handleSend(isAr ? 'حول هذه الصورة إلى كارتون' : 'Convert image to cartoon')}\n            >\n              🎭 {isAr ? 'تحويل لكارتون' : 'Cartoonize'}\n            <\/button>\n            <button\n              className=\"ps-btn text-[11px] py-1 px-2.5 rounded-full bg-[var(--row)]\"\n              onClick={() => handleSend(isAr ? 'احذف الخلفية واعزل العنصر' : 'Remove background')}\n            >\n              ✨ {isAr ? 'حذف الخلفية' : 'Cutout BG'}\n            <\/button>\n            <button\n              className=\"ps-btn text-[11px] py-1 px-2.5 rounded-full bg-[var(--row)]\"\n              onClick={() => handleSend(isAr ? 'قسم الصورة لشرائح سحرية 2×2' : 'Split 2x2 slices')}\n            >\n              ✂️ {isAr ? 'شرائح سحرية 2×2' : 'Slices 2x2'}\n            <\/button>\n            <button\n              className=\"ps-btn text-[11px] py-1 px-2.5 rounded-full bg-[var(--row)]\"\n              onClick={() => handleSend(isAr ? 'طبق فلتر دافئ' : 'Warm filter')}\n            >\n              🎨 {isAr ? 'فلتر دافئ' : 'Warm'}\n            <\/button>\n            <button\n              className=\"ps-btn text-[11px] py-1 px-2.5 rounded-full bg-[var(--row)]\"\n              onClick={() => handleSend(isAr ? 'حول لأبيض وأسود' : 'B&W')}\n            >\n              🖤 {isAr ? 'أبيض وأسود' : 'B&W'}\n            <\/button>\n          <\/>\n        )}\n\n        {item.type === 'text' && (\n          <>\n            <button\n              className=\"ps-btn text-[11px] py-1 px-2.5 rounded-full bg-gradient-to-r from-blue-500/15 to-indigo-500/15 text-blue-600 border border-blue-400/30 font-bold\"\n              onClick={() => handleSend(isAr ? 'تعمل صورة كارتونية ملونة' : 'Create cartoon illustration')}\n            >\n              🎭 {isAr ? 'توليد صورة كارتونية' : 'Cartoon Art'}\n            <\/button>\n            <button\n              className=\"ps-btn text-[11px] py-1 px-2.5 rounded-full bg-[var(--row)]\"\n              onClick={() => handleSend(isAr ? 'أعد صياغة النص بأسلوب تسويقي جذاب' : 'Marketing tone')}\n            >\n              ✨ {isAr ? 'أسلوب تسويقي' : 'Marketing'}\n            <\/button>\n            <button\n              className=\"ps-btn text-[11px] py-1 px-2.5 rounded-full bg-[var(--row)]\"\n              onClick={() => handleSend(isAr ? 'اختصر النص' : 'Shorten text')}\n            >\n              ✂️ {isAr ? 'اختصار' : 'Shorten'}\n            <\/button>\n            <button\n              className=\"ps-btn text-[11px] py-1 px-2.5 rounded-full bg-[var(--row)]\"\n              onClick={() => handleSend(isAr ? 'دقق الأخطاء لغوياً ونحوياً' : 'Fix grammar')}\n            >\n              📝 {isAr ? 'تدقيق لغوي' : 'Grammar'}\n            <\/button>\n          <\/>\n        )}\n\n        {item.type !== 'img' && item.ty ta;\n  onClose: () => void;\n  toast: (msg: string) => void;\n}\n\nexport function DeveloperTemplateModal({\n  currentPageItems,\n  doc,\n  onClose,\n  toast,\n}: DeveloperTemplateModalProps) {\n  const [title, setTitle] = useState('');\n  const [category, setCategory] = useState<'magazines' | 'newspapers' | 'identity' | 'posters' | 'custom'>('magazines');\n  const [description, setDescription] = useState('');\n  const [author, setAuthor] = useState('المطور');\n  const [templatesList, setTemplatesList] = useState<DeveloperTemplate[]>([]);\n\n  useEffect(() => {\n    kvGet<DeveloperTemplate[]>('ps_dev_templates')\n      .then((v) => {\n        if (Array.isArray(v)) setTemplatesList(v);\n      })\n      .catch(() => {});\n  }, []);\n\n  const persistTemplates = async (list: DeveloperTemplate[]) => {\n    try {\n      await kvSet('ps_dev_templates', list);\n      window.dispatchEvent(new Event('ps-templates-changed'));\n      return true;\n    } catch (_) {\n      toast('⚠ تعذّر حفظ القوالب (المساحة ممتلئة). صدّر القوالب كملف.');\n      return false;\n    }\n  };\n\n  const handleSaveCurrentAsTemplate = () => {\n    if (!title.trim()) {\n      toast('يرجى كتابة عنوان للقالب');\n      return;\n    }\n    if (currentPageItems.length === 0) {\n      toast('الصفحة الحالية فارغة! أضف عناصر أولاً لحفظها كقالب');\n      return;\n    }\n\n    const cleanItems = JSON.parse(JSON.stringify(currentPageItems));\n    const newTemplate: DeveloperTemplate = {\n      id: `dev_tpl_${Date.now()}`,\n      title: title.trim(),\n      category,\n      description: description.trim() || 'قالب احترافي معتمد من المطور',\n      previewBg: 'linear-gradient(135deg, #1e293b 0%, #334155 100%)',\n      size: doc.size,\n      items: cleanItems,\n      author: author.trim() || 'المطور',\n      createdAt: Date.now(),\n    };\n\n    const updated = [newTemplate, ...templatesList];\n    persistTemplates(updated).then((okSaved) => {\n      if (!okSaved) return;\n      setTemplatesList(updated);\n      setTitle('');\n      setDescription('');\n      toast(`تم تسجيل القالب «${newTemplate.title}» كقالب ثابت في البرنامج بنجاح!`);\n    });\n  };\n\n  const handleDeleteTemplate = (id: string) => {\n    const updated = templatesList.filter((t) => t.id !== id);\n    persistTemplates(updated).then((okSaved) => {\n      if (!okSaved) return;\n      setTemplatesList(updated);\n      toast('تم حذف القالب المعتمد');\n    });\n  };\n\n  const handleExportTemplates = () => {\n    const dataStr = 'data:text/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(templatesList, null, 2));\n    const a = document.createElement('a');\n    a.href = dataStr;\n    a.download = 'developer_templates_bundle.json';\n    a.click();\n    toast('تم تنزيل حزمة قوالب المطور');\n  };\n\n  return (\n    <div className=\"sheet-backdrop z-50 flex items-center justify-center p-3\">\n      <div className=\"bg-[var(--bar)] border border-[var(--bd)] shadow-2xl rounded-2xl w-full max-w-xl max-h-[90vh] flex flex-col overflow-hidden animate-in zoom-in-95 duration-150\">\n        {/* Header */}\n        <div className=\"flex items-center justify-between px-5 py-3.5 border-b border-[var(--bd)] font-bold text-sm\">\n          <div className=\"flex items-center gap-2\">\n            <span>🛠️<\/span>\n            <span>استوديو قوالب المطور (Developer Template Studio)<\/span>\n          <\/div>\n          <button onClick={onClose} className=\"text-xs text-[var(--mut)] hover:text-[var(--fg)] p-1\">\n            ✕\n          <\/button>\n        <\/div>\n\n        {/* Content */}\n        <div className=\"overflow-y-auto p-5 space-y-4\">\n          <div className=\"p-3 rounded-xl bg-blue-500/10 border border-blue-500/20 text-xs text-blue-700 dark:text-blue-300\">\n            👑 بصفتك مطور البرنامج، يمكنك تحويل التصميم النشط حالياً إلى قالب رسمي وثابت يظهر لجميع المستخدمين في تبويب القوالب!\n          <\/div>\n\n          {/* Form to Save Current Page */}\n          <div className=\"space-y-3 bg-[var(--row)] p-4 rou ustify-end pt-1\">\n              <button\n                onClick={handleSaveCurrentAsTemplate}\n                className=\"ps-btn ps-btn-primary text-xs py-1.5 px-4 font-bold\"\n              >\n                + اعتماد القالب وحفظه في البرنامج\n              <\/button>\n            <\/div>\n          <\/div>\n\n          {/* List of Registered Developer Templates */}\n          <div>\n            <div className=\"flex items-center justify-between mb-2\">\n              <span className=\"text-xs font-bold text-[var(--fg)]\">\n                القوالب المعتمدة المسجلة ({templatesList.length})\n              <\/span>\n              {templatesList.length > 0 && (\n                <button\n                  onClick={handleExportTemplates}\n                  className=\"text-[11px] text-[var(--ac)] hover:underline font-semibold\"\n                >\n                  📥 تصدير حزمة القوالب (.json)\n                <\/button>\n              )}\n            <\/div>\n\n            {templatesList.length === 0 ? (\n              <div className=\"text-xs text-[var(--mut)] text-center py-4 bg-[var(--row)] rounded-xl border border-[var(--bd)]\">\n                لم يتم تسجيل قوالب مطور مخصصة بعد. احفظ تصميمك الحالي الآن!\n              <\/div>\n            ) : (\n              <div className=\"space-y-2 max-h-48 overflow-y-auto\">\n                {templatesList.map((tpl) => (\n                  <div\n                    key={tpl.id}\n                    className=\"p-2.5 rounded-xl bg-[var(--row)] border border-[var(--bd)] flex items-center justify-between text-xs\"\n                  >\n                    <div>\n                      <div className=\"font-bold text-[var(--fg)]\">{tpl.title}<\/div>\n                      <div className=\"text-[10px] text-[var(--mut)]\">\n                        قسم: {tpl.category} · مقاس: {tpl.size} · {tpl.items.length} عنصر\n                      <\/div>\n                    <\/div>\n                    <button\n                      onClick={() => handleDeleteTemplate(tpl.id)}\n                      className=\"text-rose-500 hover:bg-rose-500/10 p-1 rounded text-xs\"\n                      title=\"حذف\"\n                    >\n                      ✕\n                    <\/button>\n                  <\/div>\n                ))}\n              <\/div>\n            )}\n          <\/div>\n        <\/div>\n\n        {/* Footer */}\n        <div className=\"px-5 py-3 border-t border-[var(--bd)] bg-[var(--row)] flex justify-end\">\n          <button className=\"ps-btn text-xs py-1.5 px-4\" onClick={onClose}>\n            إغلاق\n          <\/button>\n        <\/div>\n      <\/div>\n    <\/div>\n  );\n}\n", "src/components/DesignAuditOverlay.tsx": "/**\n * @license\n * SPDX-License-Identifier: Apache-2.0\n */\n\nimport React, { useState } from 'react';\nimport { DesignIssue, DocData, Item } from '../types/printStudio';\n\ninterface DesignAuditOverlayProps {\n  issues: DesignIssue[];\n  scale: number;\n  doc: DocData;\n  onAutoFix: (issue: DesignIssue) => void;\n  onClose: () => void;\n}\n\nexport function DesignAuditOverlay({\n  issues,\n  scale,\n  doc,\n  onAutoFix,\n  onClose,\n}: DesignAuditOverlayProps) {\n  const [selectedIssueId, setSelectedIssueId] = useState<string | null>(null);\n\n  const selectedIssue = issues.find((i) => i.id === selectedIssueId);\n\n  return (\n    <>\n      {/* Visual Markers positioned directly on the canvas elements */}\n      <div\n        className=\"absolute inset-0 pointer-events-none z-30\"\n        style={{ width: `${doc.w}px`, height: `${doc.h}px` }}\n      >\n        {issues.map((issue) => {\n          const isSelected = issue.id === selectedIssueId;\n          const isError = issue.severity === 'error';\n\n          return (\n            <div\n              key={issue.id}\n              className=\"absolute pointer-events-auto cursor-pointer group\"\n              style={{\n                left: `${issue.x}px`,\n                top: `${issue.y}px`,\n                width: `${Math.max(24, issue.w)}px`,\n                height: `${Math.max(24, issue.h)}px`,\n              }}\n              onClick={(e) => {\n                e.stopPropagation();\n                setSelectedIssueId(issue.id);\n              }}\n            >\n              {/* Highlight Bounding Box */}\n              <div\n                className={`w-full h-full border-2 rounded transition-all duration-200 ${\n                  isError\n                    ? 'border-rose-500/80 bg-rose-500/10'\n                    : 'border-amber-500/80 bg-amber-500/10'\n                } ${isSelected ? 'ring-4 ring-rose-400/50 ring-offset-1' : ''}`}\n              />\n\n              {/* Pulsing Target Dot on corner */}\n              <div className=\"absolute -top-3 -right-3 flex items-center justify-center\">\n                <span\n                  className={`absolute w-6 h-6 rounded-full animate-ping opacity-75 ${\n                    isError ? 'bg-rose-500' : 'bg-amber-500'\n                  }`}\n                />\n                <span\n                  className={`relative flex items-center justify-center w-5 h-5 rounded-full text-[10px] font-bold text-white shadow-md ${\n                    isError ? 'bg-rose-600' : 'bg-amber-600'\n                  }`}\n                >\n                  !\n                <\/span>\n              <\/div>\n            <\/div>\n          );\n        })}\n      <\/div>\n\n      {/* Floating Guidance Panel at Bottom Right of Screen */}\n      <div className=\"fixed bottom-16 right-4 sm:right-8 z-40 max-w-sm w-full bg-[var(--bar)] border border-[var(--bd)] shadow-2xl rounded-2xl p-4 animate-in slide-in-from-bottom duration-200\">\n        <div className=\"flex items-center justify-between pb-2 border-b border-[var(--bd)]\">\n          <div className=\"flex items-center gap-2\">\n            <span className=\"text-rose-500 font-bold text-sm\">🔍 فاحص أسس وقواعد التصميم<\/span>\n            <span className=\"text-xs px-2 py-0.5 rounded-full bg-rose-500/10 text-rose-600 font-semibold\">\n              {issues.length} {issues.length === 1 ? 'ملاحظة' : 'ملاحظات'}\n            <\/span>\n          <\/div>\n          <button\n            onClick={onClose}\n            className=\"text-xs text-[var(--mut)] hover:text-[var(--fg)] p-1 rounded-md\"\n            title=\"إغلاق الفاحص\"\n          >\n            ✕\n          <\/button>\n        <\/div>\n\n        {issues.length === 0 ? (\n          <div className=\"py-6 text-center text-xs text-emerald-600 font-medium\">\n            🎉 رائع جداً! التصميم يراعي كافة أسس وقواعد التصميم والطباعة المعيارية.\n          <\/div>\n        ) : selectedIssue ? (\n          <div className=\"py-3 space-y-2\">\n            <div className=\"flex items-center justify-between\">\n              <h4 className=\"text-xs font-bold text-[var(--fg)]\">{selectedIssue.title}<\/h4>\n              <span\n                className={`text-[10px] px-2 py-0.5 rounded ${\n                  selectedIssue.severity === 'error'\n                    ? 'bg-rose-100 text-rose-700'\n                    : 'bg-amber-100 text-amber-700'\n                }`}\n              >\n                {selectedIssue.severity === 'error' ? 'حرج للمطبعة' : 'تحسين بصري'}\n              <\/span>\n            <\/div>\n\n            <p className=\"text-xs text-[var(--fg)] leading-relaxed\">\n              {selectedIssue.description}\n            <\/p>\n\n            <div className=\"bg-[var(--row)] p-2.5 rounded-xl border border-[var(--bd)] text-xs text-[var(--mut)] leading-relaxed\">\n              <span className=\"font-semibold text-[var(--fg)] block mb-0.5\">💡 إرشاد للمبتدئين:<\/span>\n              {selectedIssue.advice}\n            <\/div>\n\n            <div className=\"flex gap-2 pt-2\">\n              {selectedIssue.canAutoFix && (\n                <button\n                  className=\"ps-btn ps-btn-primary flex-1 text-xs py-1.5 font-bold\"\n                  onClick={() => onAutoFix(selectedIssue)}\n   setV(String(value));\n      return;\n    }\n    const c = min !== undefined ? Math.max(min, n) : n;\n    if (Math.abs(c - value) > 0.001) onCommit(c);\n    else setV(String(value));\n  };\n  return (\n    <label className=\"flex items-center gap-1 shrink-0 text-[11px] text-[var(--mut)]\">\n      <span>{label}<\/span>\n      <input\n        type=\"number\"\n        inputMode=\"decimal\"\n        step={step}\n        value={v}\n        onChange={(e) => setV(e.target.value)}\n        onBlur={commit}\n        onKeyDown={(e) => {\n          if (e.key === 'Enter') (e.target as HTMLInputElement).blur();\n        }}\n        className=\"ps-input w-16 text-xs py-0.5 px-1.5\"\n        style={{ minHeight: 34 }}\n      />\n    <\/label>\n  );\n}\n\nexport function FrameInspector({\n  item,\n  isAr,\n  onChange,\n}: {\n  item: Item;\n  isAr: boolean;\n  onChange: (patch: Partial<Item>) => void;\n}) {\n  const mm = (pt: number) => +(pt / MM).toFixed(1);\n  const isText = item.type === 'text';\n  const isImg = item.type === 'img';\n  return (\n    <div className=\"ps-bar border-t border-[var(--bd)] bg-[var(--bar)] py-1.5 px-3 z-30\" style={{ flexWrap: 'wrap', overflowX: 'visible', maxHeight: '40vh', overflowY: 'auto' }}>\n      <span className=\"text-[11px] font-bold shrink-0\">📐 {isAr ? 'المساحة (مم)' : 'Frame (mm)'}<\/span>\n      <NumField label=\"X\" value={mm(item.x)} onCommit={(n) => onChange({ x: n * MM })} />\n      <NumField label=\"Y\" value={mm(item.y)} onCommit={(n) => onChange({ y: n * MM })} />\n      <NumField label={isAr ? 'العرض' : 'W'} value={mm(item.w)} min={5} onCommit={(n) => onChange({ w: n * MM })} />\n      <NumField label={isAr ? 'الارتفاع' : 'H'} value={mm(item.h)} min={5} onCommit={(n) => onChange({ h: n * MM })} />\n      {isText && (\n        <>\n          <span className=\"w-full h-0\" />\n          <button\n            className=\"ps-btn text-xs py-1 px-3 bg-[var(--row)] shrink-0\"\n            style={{ minHeight: 34 }}\n            onClick={() =>\ Key(e.target.value)} className=\"ps-select text-xs w-full bg-[var(--row)]\">\n        {SETS.map(([k, n]) => (\n          <option key={k} value={k}>\n            {n}\n          <\/option>\n        ))}\n      <\/select>\n\n      <div className=\"flex-1 overflow-y-auto min-h-0 flex flex-col gap-2\">\n        {!q.trim() && (\n          <>\n            <div className=\"flex flex-wrap gap-1\">\n              {POP.map((w) => (\n                <button key={w} onClick={() => setQ(w)} className=\"ps-btn text-[11px] py-0.5 px-2 bg-[var(--row)]\">\n                  {w}\n                <\/button>\n              ))}\n            <\/div>\n            <div className=\"text-[10px] text-[var(--mut)]\">\n              {isAr\n                ? 'اكتب كلمة للبحث في أكثر من 200 ألف أيقونة مجانية مفتوحة المصدر (Iconify)، أو اختر من الأيقونات الجاهزة أدناه.'\n                : 'Search 200k+ free open-source icons (Iconify), or pick a built-in icon below.'}\n            <\/div>\n            <div className=\"grid grid-cols-4 gap-1.5\">\n              {builtin.map((ic) => (\n                <button key={ic.id} onClick={() => addBuiltin(ic)} title={isAr ? ic.name : ic.nameEn} className=\"p-1.5 rounded-lg border border-[var(--bd)] flex items-center justify-center\" style={{ background: '#fff' }}>\n                  <svg viewBox={ic.viewBox || '0 0 24 24'} fill=\"none\" stroke={color} strokeWidth=\"2\" strokeLinecap=\"round\" strokeLinejoin=\"round\" width=\"26\" height=\"26\">\n                    <path d={ic.svgPath} />\n                  <\/svg>\n                <\/button>\n              ))}\n            <\/div>\n          <\/>\n        )}\n        {loading && <div className=\"text-xs text-[var(--mut)]\">{isAr ? 'جارٍ البحث...' : 'Searching...'}<\/div>}\n        {err && <div className=\"text-xs text-rose-500 leading-relaxed\">{err}<\/div>}\n        {!loading && !err && q.trim() && icons.length === 0 && <div className=\"text-xs text-[var(--mut)]\">{isAr ? 'لا نتائج. جرّب كلمة إنجليزية أخرى.' ull);\n  const vTrack = useRef<HTMLDivElement>(null);\n\n  const measure = useCallback(() => {\n    const st = stageRef.current;\n    if (!st) return;\n    setM({ sl: st.scrollLeft, sw: st.scrollWidth, cw: st.clientWidth, t: st.scrollTop, sh: st.scrollHeight, ch: st.clientHeight });\n  }, [stageRef]);\n\n  useEffect(() => {\n    const st = stageRef.current;\n    if (!st) return;\n    measure();\n    st.addEventListener('scroll', measure, { passive: true });\n    let ro: ResizeObserver | null = null;\n    if (typeof ResizeObserver !== 'undefined') {\n      ro = new ResizeObserver(measure);\n      ro.observe(st);\n      if (st.firstElementChild) ro.observe(st.firstElementChild);\n    }\n    return () => {\n      st.removeEventListener('scroll', measure);\n      if (ro) ro.disconnect();\n    };\n  }, [stageRef, measure]);\n\n  useEffect(() => {\n    const id = requestAnimationFrame(() => requestAnimationFrame(measure));\n    return () => cancelAnimationFrame(id);\n  }, [tick, measure]);\n\n  const startDrag = (e: React.PointerEvent, axis: 'x' | 'y') => {\n    const st = stageRef.current;\n    const tr = (axis === 'x' ? hTrack : vTrack).current;\n    if (!st || !tr) return;\n    e.preventDefault();\n    e.stopPropagation();\n    const target = e.currentTarget as HTMLElement;\n    try {\n      target.setPointerCapture(e.pointerId);\n    } catch (_) {}\n    const start = axis === 'x' ? e.clientX : e.clientY;\n    const s0 = axis === 'x' ? st.scrollLeft : st.scrollTop;\n    const trackLen = Math.max(1, axis === 'x' ? tr.clientWidth : tr.clientHeight);\n    const content = axis === 'x' ? st.scrollWidth : st.scrollHeight;\n    const mv = (ev: PointerEvent) => {\n      const d = ((axis === 'x' ? ev.clientX : ev.clientY) - start) * (content / trackLen);\n      if (axis === 'x') st.scrollLeft = s0 + d;\n      else st.scrollTop = s0 + d;\n    };\n    const up = () => {\n      target.removeEventListener('pointermove', mv);\n      target.removeEventListener('pointerup', up);\n mport React, { useState } from 'react';\nimport { DocData, Item } from '../types/printStudio';\nimport { AIDialog } from './AIDialog';\nimport { AISettings, Provider, askAI, extractJSON, loadAISettings, saveAISettings } from '../services/aiClient';\n\nconst MM = 2.8346;\nconst FONTS = ['Cairo', 'Tajawal', 'Amiri', 'Reem Kufi', 'Playfair Display', 'Montserrat', 'Oswald', 'Lobster'];\n\ninterface Props {\n  item: Item | null;\n  doc: DocData;\n  imageDataUrl?: string;\n  onUpdateItem: (updates: Partial<Item>) => void;\n  onUpdateImage: (key: string, dataUrl: string) => void;\n  onAddMultipleItems: (items: Item[], images: Record<string, string>) => void;\n  onAddItems: (items: Partial<Item>[]) => void;\n  onClose: () => void;\n  toast: (m: string) => void;\n  lang?: 'ar' | 'en';\n}\n\ntype Tab = 'text' | 'design' | 'images' | 'settings';\n\nconst QUICK: [string, string, string][] = [\n  ['أعد الصياغة', 'Rewrite', 'Rewrite this text to be clearer and more professional. Keep the meaning and the language.'],\n  ['اختصر', 'Shorten', 'Shorten this text by about half. Keep the key message and the language.'],\n  ['وسّع', 'Expand', 'Expand this text with a bit more detail. Keep the tone and the language.'],\n  ['صحّح لغوياً', 'Proofread', 'Fix spelling, grammar and punctuation only. Keep wording and language.'],\n  ['اجعله عنواناً جذاباً', 'Catchy headline', 'Turn this into a short, catchy headline in the same language.'],\n  ['ترجم للإنجليزية', 'To English', 'Translate this text to English.'],\n  ['ترجم للعربية', 'To Arabic', 'Translate this text to Modern Standard Arabic.'],\n];\n\nexport function AIAssistant(p: Props) {\n  const isAr = (p.lang || 'ar') === 'ar';\n  const [st, setSt] = useState<AISettings>(() => loadAISettings());\n  const hasKey = !!st[st.provider].key.trim();\n  const isText = !!p.item && p.item.type === 'text';\n  const isImg = !!p.item && p.item.type === 'img';\n  const [tab, setTab] = useState<Tab>(!hasKey ? 'settings' : isImg ? 'images' : isText ? 'te e form {\"items\":[...]} and nothing else. The page is ${wmm}x${hmm} mm. ` +\n        `Each item: {\"type\":\"rect\"|\"ell\"|\"text\",\"x\":number,\"y\":number,\"w\":number,\"h\":number,\"color\":\"#rrggbb\"} in millimetres from the top-left corner. ` +\n        `Text items also need \"text\", \"fs\" (font size in pt, 8 to 120), \"fam\" (one of ${FONTS.join(', ')}), \"b\" (true/false) and \"a\" (\"start\"|\"center\"|\"end\"). ` +\n        `Start with one full-page background rect. Use at most 14 items, keep everything inside the page with at least 8 mm margins, ensure strong text contrast, and do not use images. ` +\n        `If the request is in Arabic, write the text in Arabic with fam \"Cairo\" or \"Tajawal\".`;\n      const j = extractJSON(await askAI(st, sys, desc));\n      const arr: any[] = Array.isArray(j.items) ? j.items : [];\n      const out: Partial<Item>[] = arr.slice(0, 20).map((it, n) => {\n        const type = it.type === 'text' ? 'text' : it.type === 'ell' ? 'ell' : 'rect';\n        const x = Math.max(0, Number(it.x) || 0) * MM;\n        const y = Math.max(0, Number(it.y) || 0) * MM;\n        const w = Math.min(p.doc.w, Math.max(5, Number(it.w) || 30) * MM);\n        const h = Math.min(p.doc.h, Math.max(2, Number(it.h) || 10) * MM);\n        const base: Partial<Item> = { type, x, y, w, h, color: typeof it.color === 'string' ? it.color : '#1b2f6b', name: `AI ${n + 1}` };\n        if (type === 'text') {\n          const fs = Math.min(120, Math.max(8, Number(it.fs) || 20));\n          return { ...base, text: String(it.text || ''), fs, fam: FONTS.includes(it.fam) ? it.fam : 'Cairo', b: it.b ? 1 : 0, a: ['start', 'center', 'end'].includes(it.a) ? it.a : 'start', h: Math.max(h, fs * 1.3) };\n        }\n        return base;\n      });\n      if (!out.length) throw new Error(isAr ? 'لم يرجع النموذج تصميماً صالحاً، أعد المحاولة.' : 'No valid layout returned.');\n      setLayout(out);\n    });\n\n  const tabBtn = (id: Tab, label: string) => (\n    <button key ]\">{isAr ? 'اسم النموذج (يمكن تعديله)' : 'Model name (editable)'}<\/label>\n          <input type=\"text\" className=\"ps-input text-xs\" value={st[prov].model} onChange={(e) => setCfg(prov, 'model', e.target.value)} dir=\"ltr\" />\n          <div className=\"text-[11px] text-[var(--mut)] leading-relaxed\">\n            {prov === 'gemini'\n              ? (isAr ? 'احصل على مفتاح من aistudio.google.com/apikey (توجد حصة مجانية). إن رُفض اسم النموذج فجرّب gemini-3.5-flash-lite.' : 'Get a key at aistudio.google.com/apikey (free tier available).')\n              : (isAr ? 'احصل على مفتاح من platform.openai.com/api-keys (خدمة مدفوعة، وهي منفصلة عن اشتراك ChatGPT). إن رُفض اسم النموذج فاكتب نموذجاً متاحاً لحسابك.' : 'Get a key at platform.openai.com/api-keys (paid, separate from ChatGPT plans).')}\n          <\/div>\n          <div className=\"text-[11px] leading-relaxed p-2 rounded-lg bg-amber-500/10 border border-amber-500/30\">\n            {isAr\n              ? 'يُحفظ المفتاح داخل متصفحك فقط ولا يُرفع إلى أي مكان، ويُرسل مباشرة إلى Google أو OpenAI. لا تستخدمه على جهاز مشترك. ملاحظة: النص الذي ترسله يُعالَج لدى الجهة التي اخترتها.'\n              : 'The key stays in your browser and is sent only to Google/OpenAI. Do not use it on shared devices.'}\n          <\/div>\n          <button className=\"ps-btn ps-btn-primary text-xs py-1.5\" onClick={() => run(async () => { const t = await askAI(st, 'Reply with the single word: OK', 'ping'); p.toast((isAr ? 'الاتصال ناجح: ' : 'Connected: ') + t.slice(0, 20)); })} disabled={busy}>\n            {busy ? '...' : (isAr ? 'اختبار الاتصال' : 'Test connection')}\n          <\/button>\n        <\/div>\n      )}\n\n      {tab === 'text' && (\n        <div className=\"flex flex-col gap-2.5\">\n          {!isText && <div className=\"text-[11px] text-[var(--mut)]\">{isAr ? 'لم تحدد مربع نص. اكتب ما تريد وسيُنشأ نص جديد تضيفه إلى الصفحة.' : 'No text box selected: describe the text to create.'}<\/div>}\n          {isText && (\n كمربع نص' : 'Added'); setResult(''); }}>{isAr ? 'إضافة كمربع نص جديد' : 'Add as new text'}<\/button>\n              <\/div>\n            <\/div>\n          )}\n        <\/div>\n      )}\n\n      {tab === 'design' && (\n        <div className=\"flex flex-col gap-2.5\">\n          <div className=\"text-[11px] text-[var(--mut)] leading-relaxed\">{isAr ? 'صف المطبوع الذي تريده (النوع، الموضوع، الألوان) وسيقترح المساعد تخطيطاً من نصوص وأشكال تضيفه إلى الصفحة الحالية.' : 'Describe the layout you want.'}<\/div>\n          <textarea className=\"ps-input text-xs\" rows={3} value={desc} onChange={(e) => setDesc(e.target.value)} placeholder={isAr ? 'مثال: فلاير افتتاح مقهى بألوان البني والكريمي، عنوان كبير وتاريخ وعنوان المكان' : 'e.g. Grand opening flyer for a coffee shop'} />\n          <button className=\"ps-btn ps-btn-primary text-xs py-1.5\" disabled={busy || !desc.trim()} onClick={doDesign}>{busy ? (isAr ? 'جارٍ التصميم...' : 'Designing...') : (isAr ? 'اقترح تصميماً' : 'Suggest layout')}<\/button>\n          {layout && (\n            <div className=\"flex flex-col gap-2 p-2 rounded-lg border border-[var(--ac)]\">\n              <div className=\"text-xs\">{isAr ? `جاهز: ${layout.length} عنصر` : `${layout.length} items ready`}<\/div>\n              <div className=\"flex gap-1.5\">\n                <button className=\"ps-btn ps-btn-primary text-xs py-1 px-3\" onClick={() => { p.onAddItems(layout); setLayout(null); p.onClose(); }}>{isAr ? 'إضافة إلى الصفحة' : 'Add to page'}<\/button>\n                <button className=\"ps-btn text-xs py-1 px-3\" onClick={() => setLayout(null)}>{isAr ? 'تجاهل' : 'Discard'}<\/button>\n              <\/div>\n              <div className=\"text-[10px] text-[var(--mut)]\">{isAr ? 'يمكنك التراجع بزر «تراجع» بعد الإضافة.' : 'You can undo after adding.'}<\/div>\n            <\/div>\n          )}\n        <\/div>\n      )}\n\n      {tab === 'images' && p.item && isImg && (\n        <AIDialog\n          item={p.item}\n          imageDataUrl={p.imageDataUrl}\n          onUpdateItem={p.onUpdateItem}\n          onUpdateImage={p.onUpdateImage}\n          onAddMultipleItems={p.onAddMultipleItems}\n          onClose={p.onClose}\n          toast={p.toast}\n          lang={p.lang}\n        />\n      )}\n    <\/div>\n  );\n}\n", "src/services/aiClient.ts": "export type Provider = 'gemini' | 'openai';\n\nexport interface AISettings {\n  provider: Provider;\n  gemini: { key: string; model: string };\n  openai: { key: string; model: string };\n}\n\nconst KEY = 'ps_ai_settings';\n\nexport const AI_DEFAULTS: AISettings = {\n  provider: 'gemini',\n  gemini: { key: '', model: 'gemini-3.6-flash' },\n  openai: { key: '', model: 'chat-latest' },\n};\n\nexport function loadAISettings(): AISettings {\n  try {\n    const s = JSON.parse(localStorage.getItem(KEY) || 'null');\n    if (s) {\n      return {\n        provider: s.provider === 'openai' ? 'openai' : 'gemini',\n        gemini: { ...AI_DEFAULTS.gemini, ...(s.gemini || {}) },\n        openai: { ...AI_DEFAULTS.openai, ...(s.openai || {}) },\n      };\n    }\n  } catch (_) {}\n  return AI_DEFAULTS;\n}\n\nexport function saveAISettings(s: AISettings) {\n  try {\n    localStorage.setItem(KEY, JSON.stringify(s));\n  } catch (_) {}\n}\n\nexport async function askAI(s: AISettings, system: string, user: string): Promise<string> {\n  const cfg = s[s.provider];\n  if (!cfg.key.trim()) throw new Error('NO_KEY');\n  if (s.provider === 'gemini') {\n    const r = await fetch(\n      `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(cfg.model.trim())}:generateContent`,\n      {\n        method: 'POST',\n        headers: { 'Content-Type': 'application/json', 'x-goog-api-key': cfg.key.trim() },\n        body: JSON.stringify({\n          systemInstruction: { parts: [{ text: system }] },\n          contents: [{ role: 'user', parts: [{ text: user }] }],\n        }),\n      }\n    );\n    const j: any = await r.json().catch(() => null);\n    if (!r.ok) throw new Error((j && j.error && j.error.message) || `HTTP ${r.status}`);\n    const parts = (j && j.candidates && j.candidates[0] && j.candidates[0].content && j.candidates[0].content.parts) || [];\n    const t = parts.map((p: any) => p.text || '').join('');\n    if (!t.trim()) throw new Error('Empty response');\n    return t.trim();\n  }\n  const r = await fetch('https://api.openai.com/v1/chat/completions', {\n    method: 'POST',\n    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${cfg.key.trim()}` },\n    body: JSON.stringify({\n      model: cfg.model.trim(),\n      messages: [\n        { role: 'system', content: system },\n        { role: 'user', content: user },\n      ],\n    }),\n  });\n  const j: any = await r.json().catch(() => null);\n  if (!r.ok) throw new Error((j && j.error && j.error.message) || `HTTP ${r.status}`);\n  const t = j && j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;\n  if (!t || !String(t).trim()) throw new Error('Empty response');\n  return String(t).trim();\n}\n\nexport function extractJSON(text: string): any {\n  let t = text.replace(/```json|```/gi, '').trim();\n  const a = t.indexOf('{');\n  const b = t.lastIndexOf('}');\n  if (a < 0 || b <= a) throw new Error('No JSON in response');\n  t = t.slice(a, b + 1);\n  return JSON.parse(t);\n}\n", "src/services/exporters.ts": "import { DocData, Item } from '../types/printStudio';\nimport { layoutText } from './textLayout';\n\ntype DrawFn = (x: CanvasRenderingContext2D, list: Item[], pStr: string) => Promise<void>;\n\nconst hex = (c?: string) => {\n  let s = (c || '#000000').trim();\n  if (/^#[0-9a-f]{3}$/i.test(s)) s = '#' + s[1] + s[1] + s[2] + s[2] + s[3] + s[3];\n  if (/^#[0-9a-f]{6}/i.test(s)) return s.slice(1, 7).toUpperCase();\n  return '000000';\n};\n\nfunction boundsOf(it: Item, mctx: CanvasRenderingContext2D, pStr: string) {\n  if (it.type === 'text') {\n    const T = layoutText(mctx, it, pStr);\n    return { x: it.x, y: it.y, w: it.w, h: it.fixedH ? it.h : Math.max(it.h, T.height) };\n  }\n  return { x: it.x, y: it.y, w: it.w, h: it.h };\n}\n\nasync function rasterItem(it: Item, drawItems: DrawFn, pStr: string, ppp: number, b: { x: number; y: number; w: number; h: number }) {\n  const c = document.createElement('canvas');\n  c.width = Math.max(1, Math.round(b.w * ppp));\n  c.height = Math.max(1, Math.round(b.h * ppp));\n  const x = c.getContext('2d')!;\n  x.scale(ppp, ppp);\n  x.translate(-b.x, -b.y);\n  await drawItems(x, [it], pStr);\n  return c;\n}\n\nconst listFor = (doc: DocData, pi: number) => {\n  const pg = doc.pages[pi];\n  const master = pg.m && doc.masters[pg.m] ? doc.masters[pg.m] : [];\n  return [...master, ...pg.items].filter((i) => !i.hidden);\n};\n\n// ================= PowerPoint =================\nexport async function exportPptx(doc: DocData, drawItems: DrawFn, mctx: CanvasRenderingContext2D): Promise<Blob> {\n  const P = (window as any).PptxGenJS;\n  if (!P) throw new Error('PowerPoint library not loaded');\n  const pptx = new P();\n  const inch = (v: number) => v / 72;\n  pptx.defineLayout({ name: 'PS', width: inch(doc.w), height: inch(doc.h) });\n  pptx.layout = 'PS';\n  for (let pi = 0; pi < doc.pages.length; pi++) {\n    const slide = pptx.addSlide();\n    slide.background = { color: 'FFFFFF' };\n    const pStr = String(pi + 1);\n    for (const it of listFor(doc, pi)) {\n      const tr = it.opacity !== undefined && it.opacity < 1 ? Math.round((1 - it.opacity) * 100) : 0;\n      if (it.type === 'rect' || it.type === 'ell') {\n        slide.addShape(it.type === 'rect' ? pptx.ShapeType.rect : pptx.ShapeType.ellipse, {\n          x: inch(it.x), y: inch(it.y), w: inch(it.w), h: inch(it.h),\n          fill: { color: hex(it.color), transparency: tr },\n          line: { type: 'none' },\n        });\n      } else if (it.type === 'text') {\n        const T = layoutText(mctx, it, pStr);\n        const a = it.a || 'start';\n        const align = a === 'center' ? 'center' : a === 'start' ? (T.rtl ? 'right' : 'left') : T.rtl ? 'left' : 'right';\n        T.columns.forEach((lines, ci) => {\n          if (!lines.length) return;\n          slide.addText(lines.join('\\n'), {\n            x: inch(T.colX(ci)), y: inch(it.y + T.pad), w: inch(T.colW), h: inch(T.lh * lines.length),\n            fontFace: it.fam || 'Cairo', fontSize: it.fs || 16, color: hex(it.color), bold: !!it.b,\n            align, valign: 'top', margin: 0, rtlMode: T.rtl, lineSpacing: T.lh, wrap: false, fit: 'none',\n          });\n        });\n      } else if (it.type === 'img' || it.type === 'path') {\n        const b = boundsOf(it, mctx, pStr);\n        const ppp = Math.min(3, 1600 / Math.max(b.w, b.h, 1));\n        const c = await rasterItem(it, drawItems, pStr, ppp, b);\n        slide.addImage({ data: c.toDataURL('image/png'), x: inch(b.x), y: inch(b.y), w: inch(b.w), h: inch(b.h) });\n      }\n    }\n  }\n  let out: any;\n  try {\n    out = await pptx.write({ outputType: 'blob' });\n  } catch (_) {\n    out = await pptx.write('blob');\n  }\n  return out instanceof Blob ? out : new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.presentationml.presentation' });\n}\n\n// ================= Photoshop (.psd, layered) =================\nclass BW {\n  parts: Uint8Array[] = [];\n  len = 0;\n  bytes(b: Uint8Array) { this.parts.push(b); this.len += b.length; }\n  u8(v: number) { this.bytes(Uint8Array.of(v & 255)); }\n  u16(v: number) { this.bytes(Uint8Array.of((v >> 8) & 255, v & 255)); }\n  i16(v: number) { this.u16(v & 0xffff); }\n  u32(v: number) { this.bytes(Uint8Array.of((v >>> 24) & 255, (v >>> 16) & 255, (v >>> 8) & 255, v & 255)); }\n  i32(v: number) { this.u32(v >>> 0); }\n  str(s: string) { this.bytes(Uint8Array.from(s, (ch) => ch.charCodeAt(0) & 255)); }\n  out() {\n    const o = new Uint8Array(this.len);\n    let p = 0;\n    for (const b of this.parts) { o.set(b, p); p += b.length; }\n    return o;\n  }\n}\n\nfunction packBitsRow(src: Uint8Array): Uint8Array {\n  const n = src.length;\n  const out = new Uint8Array(n + Math.ceil(n / 128) + 2);\n  let o = 0;\n  let i = 0;\n  while (i < n) {\n    let run = 1;\n    while (i + run < n && run < 128 && src[i + run] === src[i]) run++;\n    if (run >= 2) {\n      out[o++] = 257 - run;\n      out[o++] = src[i];\n      i += run;\n    } else {\n      let lit = 1;\n      while (i + lit < n && lit < 128 && !(i + lit + 1 < n && src[i + lit] === src[i + lit + 1])) lit++;\n      out[o++] = lit - 1;\n      for (let k = 0; k < lit; k++) out[o++] = src[i + k];\n      i += lit;\n    }\n  }\n  return out.slice(0, o);\n}\n\nfunction encodeChannel(plane: Uint8Array, w: number, h: number) {\n  const rows: Uint8Array[] = [];\n  let total = 0;\n  for (let r = 0; r < h; r++) {\n    const e = packBitsRow(plane.subarray(r * w, (r + 1) * w));\n    rows.push(e);\n    total += e.length;\n  }\n  return { rows, total };\n}\n\ninterface PsdLayer { name: string; left: number; top: number; canvas: HTMLCanvasElement; opacity: number }\n\nfunction buildPsd(W: number, H: number, layers: PsdLayer[], composite: HTMLCanvasElement): Uint8Array {\n  const w = new BW();\n  w.str('8BPS'); w.u16(1); w.bytes(new Uint8Array(6)); w.u16(3); w.u32(H); w.u32(W); w.u16(8); w.u16(3);\n  w.u32(0); w.u32(0);\n  const recs = new BW();\n  const data = new BW();\n  layers.forEach((L) => {\n    const lw = L.canvas.width, lh = L.canvas.height;\n    const px = L.canvas.getContext('2d')!.getImageData(0, 0, lw, lh).data;\n    const n = lw * lh;\n    const planes = [new Uint8Array(n), new Uint8Array(n), new Uint8Array(n), new Uint8Array(n)]; // A,R,G,B\n    for (let i = 0; i < n; i++) {\n      planes[0][i] = px[i * 4 + 3]; planes[1][i] = px[i * 4]; planes[2][i] = px[i * 4 + 1]; planes[3][i] = px[i * 4 + 2];\n    }\n    const enc = planes.map((pl) => encodeChannel(pl, lw, lh));\n    recs.i32(L.top); recs.i32(L.left); recs.i32(L.top + lh); recs.i32(L.left + lw);\n    recs.u16(4);\n    [-1, 0, 1, 2].forEach((id, ci) => { recs.i16(id); recs.u32(2 + 2 * lh + enc[ci].total); });\n    recs.str('8BIM'); recs.str('norm'); recs.u8(Math.max(0, Math.min(255, Math.round(L.opacity * 255)))); recs.u8(0); recs.u8(0); recs.u8(0);\n    const nm = L.name.replace(/[^\\x20-\\x7e]/g, '_').slice(0, 31);\n    let padded = 1 + nm.length;\n    while (padded % 4) padded++;\n    recs.u32(4 + 4 + padded);\n    recs.u32(0); recs.u32(0);\n    recs.u8(nm.length); recs.str(nm);\n    for (let i = 1 + nm.length; i < padded; i++) recs.u8(0);\n    enc.forEach((e) => {\n      data.u16(1);\n      e.rows.forEach((r) => data.u16(r.length));\n      e.rows.forEach((r) => data.bytes(r));\n    });\n  });\n  const info = new BW();\n  info.i16(layers.length);\n  info.bytes(recs.out());\n  info.bytes(data.out());\n  if (info.len % 2) info.u8(0);\n  w.u32(4 + info.len + 4);\n  w.u32(info.len);\n  w.bytes(info.out());\n  w.u32(0);\n  const cpx = composite.getContext('2d')!.getImageData(0, 0, W, H).data;\n  const n = W * H;\n  const rgb = [new Uint8Array(n), new Uint8Array(n), new Uint8Array(n)];\n  for (let i = 0; i < n; i++) { rgb[0][i] = cpx[i * 4]; rgb[1][i] = cpx[i * 4 + 1]; rgb[2][i] = cpx[i * 4 + 2]; }\n  const cenc = rgb.map((pl) => encodeChannel(pl, W, H));\n  w.u16(1);\n  cenc.forEach((e) => e.rows.forEach((r) => w.u16(r.length)));\n  cenc.forEach((e) => e.rows.forEach((r) => w.bytes(r)));\n  return w.out();\n}\n\nexport async function exportPsdPage(\n  doc: DocData,\n  pi: number,\n  drawItems: DrawFn,\n  renderPage: (pi: number, ppp: number, bl: number) => Promise<HTMLCanvasElement>,\n  mctx: CanvasRenderingContext2D,\n  ppp: number,\n  bl: number\n): Promise<Uint8Array> {\n  const comp = await renderPage(pi, ppp, bl);\n  const bg = document.createElement('canvas');\n  bg.width = comp.width; bg.height = comp.height;\n  const bx = bg.getContext('2d')!;\n  bx.fillStyle = '#fff'; bx.fillRect(0, 0, bg.width, bg.height);\n  const layers: PsdLayer[] = [{ name: 'Background', left: 0, top: 0, canvas: bg, opacity: 1 }];\n  const names: Record<string, string> = { text: 'Text', rect: 'Rectangle', ell: 'Ellipse', img: 'Image', path: 'Pen' };\n  let n = 0;\n  const pStr = String(pi + 1);\n  for (const it of listFor(doc, pi)) {\n    const b = boundsOf(it, mctx, pStr);\n    const c = await rasterItem(it, drawItems, pStr, ppp, b);\n    layers.push({ name: `${names[it.type] || 'Layer'} ${++n}`, left: Math.round((b.x + bl) * ppp), top: Math.round((b.y + bl) * ppp), canvas: c, opacity: it.opacity ?? 1 });\n  }\n  return buildPsd(comp.width, comp.height, layers, comp);\n}\n", "src/services/designAuditor.ts": "/**\n * @license\n * SPDX-License-Identifier: Apache-2.0\n */\n\nimport { DocData, Item, DesignIssue } from '../types/printStudio';\n\n// Helper: Calculate relative luminance from hex color\nfunction getLuminance(hex: string): number {\n  const cleanHex = hex.replace('#', '');\n  if (cleanHex.length < 6) return 0.5;\n  const r = parseInt(cleanHex.substring(0, 2), 16) / 255;\n  const g = parseInt(cleanHex.substring(2, 4), 16) / 255;\n  const b = parseInt(cleanHex.substring(4, 6), 16) / 255;\n\n  const a = [r, g, b].map((v) => {\n    return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);\n  });\n  return 0.2126 * a[0] + 0.7152 * a[1] + 0.0722 * a[2];\n}\n\nfunction getContrastRatio(hex1: string, hex2: string): number {\n  const l1 = getLuminance(hex1);\n  const l2 = getLuminance(hex2);\n  const lighter = Math.max(l1, l2);\n  const darker = Math.min(l1, l2);\n  return (lighter + 0.05) / (darker + 0.05);\n}\n\nexport function auditDesign(doc: DocData, pageIndex: number): DesignIssue[] {\n  const issues: DesignIssue[] = [];\n  const page = doc.pages[pageIndex];\n  if (!page) return issues;\n\n  const items = page.items.filter((it) => !it.hidden);\n  const safetyMargin = 16; // ~5.5mm in points\n\n  // 1. Check Bleed & Margin Safety for Text and Critical Elements\n  items.forEach((it) => {\n    if (it.type === 'text') {\n      const nearLeft = it.x < safetyMargin;\n      const nearTop = it.y < safetyMargin;\n      const nearRight = it.x + it.w > doc.w - safetyMargin;\n      const nearBottom = it.y + it.h > doc.h - safetyMargin;\n\n      if (nearLeft || nearTop || nearRight || nearBottom) {\n        issues.push({\n          id: `bleed-${it.id}`,\n          type: 'bleed',\n          severity: 'error',\n          title: 'خطر بتر النص في القص (Safety Margin)',\n          description: `النص \"${(it.text || '').substring(0, 18)}...\" قريب جداً من حافة الورقة (${Math.round(Math.min(it.x, it.y, doc.w - it.x - it.w, doc.h - it.y - it.h))}pt).`,\n          advice: 'في المطابع، تتغير حافة السكين بمقدار 2-3 مم. انقل النص للداخل بمسافة لا تقل عن 15pt لحمايته من البتر.',\n          x: it.x,\n          y: it.y,\n          w: it.w,\n          h: it.h,\n          itemId: it.id,\n          canAutoFix: true,\n        });\n      }\n    }\n  });\n\n  // 2. Check Contrast Ratio for Text against overlapping background rectangles or page\n  items.forEach((it) => {\n    if (it.type === 'text') {\n      const textColor = it.color || '#000000';\n      // Find underlying rectangle if any\n      let bgColor = '#ffffff'; // default page white\n      items.forEach((other) => {\n        if (other.id !== it.id && (other.type === 'rect' || other.type === 'ell')) {\n          // Check if text is mostly inside the other shape\n          if (\n            it.x >= other.x - 5 &&\n            it.y >= other.y - 5 &&\n            it.x + it.w <= other.x + other.w + 10 &&\n            it.y + it.h <= other.y + other.h + 10\n          ) {\n            bgColor = other.color || '#ffffff';\n          }\n        }\n      });\n\n      const ratio = getContrastRatio(textColor, bgColor);\n      if (ratio < 3.0) {\n        issues.push({\n          id: `contrast-${it.id}`,\n          type: 'contrast',\n          severity: 'error',\n          title: 'ضعف التباين البصري (Low Contrast)',\n          description: `نسبة التباين ${ratio.toFixed(1)}:1 أقل من المعيار المطلوب (4.5:1 للمطبوعات وWCAG).`,\n          advice: 'النص غير واضح وصعب القراءة. اختر لوناً أغمق للنص أو افتح للخلفية لإبراز المحتوى.',\n          x: it.x,\n          y: it.y,\n          w: it.w,\n          h: it.h,\n          itemId: it.id,\n          canAutoFix: true,\n        });\n      }\n    }\n  });\n\n  // 3. Typographic Hierarchy Check\n  const textItems = items.filter((it) => it.type === 'text');\n  textItems.forEach((it) => {\n    const fs = it.fs || 16;\n    if (fs < 8) {\n      issues.push({\n        id: `tiny-font-${it.id}`,\n        type: 'hierarchy',\n        severity: 'warning',\n        title: 'خط صغير جداً للطباعة (Illegible Font Size)',\n        description: `حجم الخط (${fs}pt) قد لا يُقرأ عند الطباعة الورقية.`,\n        advice: 'الحد الأدنى للنصوص الفرعية وهوامش المطبوعات هو 8-9pt لضمان وضوح الطباعة.',\n        x: it.x,\n        y: it.y,\n        w: it.w,\n        h: it.h,\n        itemId: it.id,\n      });\n    }\n  });\n\n  // 4. Overlapping Text Boxes\n  for (let i = 0; i < textItems.length; i++) {\n    for (let j = i + 1; j < textItems.length; j++) {\n      const a = textItems[i];\n      const b = textItems[j];\n      const overlapX = a.x < b.x + b.w && a.x + a.w > b.x;\n      const overlapY = a.y < b.y + b.h && a.y + a.h > b.y;\n\n      if (overlapX && overlapY) {\n        issues.push({\n          id: `overlap-${a.id}-${b.id}`,\n          type: 'clutter',\n          severity: 'warning',\n          title: 'تداخل غير مقصود بين النصوص',\n          description: `كتلتان نصيتان تتداخلان في نفس المساحة وتعيقان القراءة.`,\n          advice: 'افصل بين الكتل النصية أو ادمجهما في فقرة واحدة متسقة.',\n          x: Math.min(a.x, b.x),\n          y: Math.min(a.y, b.y),\n          w: Math.max(a.x + a.w, b.x + b.w) - Math.min(a.x, b.x),\n          h: Math.max(a.y + a.h, b.y + b.h) - Math.min(a.y, b.y),\n        });\n      }\n    }\n  }\n\n  // 5. Total Balance & Clutter check\n  if (items.length > 25) {\n    issues.push({\n      id: 'high-clutter',\n      type: 'clutter',\n      severity: 'info',\n      title: 'ازدحام بصري مرتفع (High Visual Clutter)',\n      description: `تحتوي الصفحة على ${items.length} عنصراً منفصلاً.`,\n      advice: 'أعطِ مساحة سلبية بيضاء (White Space) لتوجيه عين المشاهد إلى الرسالة الأهم في التصميم.',\n      x: 20,\n      y: 20,\n      w: doc.w - 40,\n      h: 40,\n    });\n  }\n\n  return issues;\n}\n", "src/services/textLayout.ts": "import { Item } from '../types/printStudio';\n\nexport const LH = 1.3;\nexport const MMPT = 2.8346;\n\nexport function wrapLines(c: CanvasRenderingContext2D, it: Item, p: string, width: number) {\n  const t = (it.text || '').replace(/‹#›/g, p);\n  c.font = `${it.b ? 700 : 400} ${it.fs || 16}px \"${it.fam || 'Cairo'}\"`;\n  const rtl = /[\\u0590-\\u08FF]/.test(t);\n  c.direction = rtl ? 'rtl' : 'ltr';\n  const out: string[] = [];\n  t.split('\\n').forEach((par) => {\n    let cur = '';\n    par.split(' ').forEach((w) => {\n      const tr = cur ? cur + ' ' + w : w;\n      if (c.measureText(tr).width > width && cur) {\n        out.push(cur);\n        cur = w;\n      } else {\n        cur = tr;\n      }\n    });\n    out.push(cur);\n  });\n  return { lines: out, rtl };\n}\n\nexport interface TextLayout {\n  columns: string[][];\n  cols: number;\n  colW: number;\n  lh: number;\n  rtl: boolean;\n  pad: number;\n  gut: number;\n  overflow: boolean;\n  height: number;\n  colX: (i: number) => number;\n}\n\nexport function layoutText(c: CanvasRenderingContext2D, it: Item, p: string): TextLayout {\n  const cols = Math.max(1, Math.min(6, Math.round(it.cols || 1)));\n  const gut = it.gut ?? 10;\n  const pad = it.pad || 0;\n  const colW = Math.max(10, (it.w - 2 * pad - gut * (cols - 1)) / cols);\n  const { lines, rtl } = wrapLines(c, it, p, colW);\n  const lh = (it.fs || 16) * LH;\n  const per = it.fixedH\n    ? Math.max(1, Math.floor((it.h - 2 * pad) / lh))\n    : Math.max(1, Math.ceil(lines.length / cols));\n  const columns: string[][] = [];\n  for (let i = 0; i < cols; i++) columns.push(lines.slice(i * per, (i + 1) * per));\n  const overflow = lines.length > per * cols;\n  const height = it.fixedH ? it.h : per * lh + 2 * pad;\n  const colX = (i: number) =>\n    rtl ? it.x + it.w - pad - (i + 1) * colW - i * gut : it.x + pad + i * (colW + gut);\n  return { columns, cols, colW, lh, rtl, pad, gut, overflow, height, colX };\n}\n\nexport function drawImageFit(x: CanvasRenderingContext2D, img: HTMLImageElement, it: Item) {\n  const fit = it.fit || 'cover';\n  const iw = img.naturalWidth || img.width;\n  const ih = img.naturalHeight || img.height;\n  if (fit === 'fill' || !iw || !ih) {\n    x.drawImage(img, it.x, it.y, it.w, it.h);\n    return;\n  }\n  const s = fit === 'contain' ? Math.min(it.w / iw, it.h / ih) : Math.max(it.w / iw, it.h / ih);\n  const dw = iw * s;\n  const dh = ih * s;\n  x.save();\n  x.beginPath();\n  x.rect(it.x, it.y, it.w, it.h);\n  x.clip();\n  x.drawImage(img, it.x + (it.w - dw) / 2, it.y + (it.h - dh) / 2, dw, dh);\n  x.restore();\n}\n", "src/services/stockMedia.ts": "/**\n * @license\n * SPDX-License-Identifier: Apache-2.0\n */\n\nexport interface StockPhoto {\n  id: string;\n  title: string;\n  titleEn: string;\n  category: 'celebrities' | 'business' | 'architecture' | 'food' | 'textures';\n  url: string;\n  tags: string[];\n}\n\nexport const STOCK_PHOTOS: StockPhoto[] = [\n  // Celebrities & Leaders\n  {\n    id: 'photo_steve',\n    title: 'ستيف جوبز - رائد التصميم والتقنية',\n    titleEn: 'Steve Jobs - Design & Tech Icon',\n    category: 'celebrities',\n    url: 'https://upload.wikimedia.org/wikipedia/commons/thumb/d/dc/Steve_Jobs_Headshot_2010-CROP_%28cropped_2%29.jpg/800px-Steve_Jobs_Headshot_2010-CROP_%28cropped_2%29.jpg',\n    tags: ['مشاهير', 'شخصيات', 'تقنية', 'بورتريه', 'steve jobs', 'apple'],\n  },\n  {\n    id: 'photo_zaha',\n    title: 'زها حديد - أيقونة العمارة العالمية',\n    titleEn: 'Zaha Hadid - Architecture Icon',\n    category: 'celebrities',\n    url: 'https://upload.wikimedia.org/wikipedia/commons/thumb/4/4b/Zaha_Hadid_in_Heydar_Aliyev_Center_in_Baku_201 ndexedDB write failed'));\n    tx.onabort = () => reject(tx.error || new Error('IndexedDB write aborted'));\n  });\n}\n\nexport async function kvGet<T = any>(key: string): Promise<T | undefined> {\n  try {\n    const v = await idbGet(key);\n    if (v !== undefined) return v as T;\n  } catch (_) {\n    // IndexedDB unavailable: fall back to localStorage below\n    try {\n      const raw = localStorage.getItem('kv:' + key);\n      if (raw) return JSON.parse(raw) as T;\n    } catch (_) {}\n  }\n  // one-time migration of legacy localStorage data\n  try {\n    const legacy = localStorage.getItem(key);\n    if (legacy) {\n      const parsed = JSON.parse(legacy);\n      try {\n        await kvSet(key, parsed);\n        localStorage.removeItem(key);\n      } catch (_) {}\n      return parsed as T;\n    }\n  } catch (_) {}\n  return undefined;\n}\n\nexport async function kvSet(key: string, val: any): Promise<void> {\n  try {\n    await idbSet(key, val);\n  } catch (e: any) {\n    if (e && (e.name === 'QuotaExceededError' || /quota/i.test(String(e.message)))) throw e;\n    // IndexedDB not available (e.g. private mode): try localStorage, may throw if full\n    localStorage.setItem('kv:' + key, JSON.stringify(val));\n  }\n}\n\nexport async function requestPersistence() {\n  try {\n    if (navigator.storage && navigator.storage.persist) await navigator.storage.persist();\n  } catch (_) {}\n}\n", "src/services/i18n.ts": "/**\n * @license\n * SPDX-License-Identifier: Apache-2.0\n */\n\nexport type Language = 'ar' | 'en';\n\nexport const translations = {\n  ar: {\n    appTitle: 'استوديو المطبوعات',\n    newFile: 'ملف جديد',\n    facingPages: 'متقابلة',\n    singlePages: 'مفردة',\n    pageOf: 'صفحة {current} من {total}',\n    prevPage: 'الصفحة السابقة',\n    nextPage: 'الصفحة التالية',\n    designAudit: 'فحص أسس التصميم',\n    auditActive: 'الفاحص نشط',\n    undo: 'تراجع',\n    exportBtn: 'تصدير',\n    lightMode: '☀️ فاتح',\n    darkMode: '🌙 داكن',\n    templatesTab: 'قوالب',\n (28, 92, 190, '+966 50 000 0000 · contact@brand.com', 9, '#a1a1aa', 'Tajawal', 0, 'start'),\n          mkT(28, 110, 190, 'الرياض، المملكة العربية السعودية', 9, '#71717a', 'Tajawal', 0, 'start'),\n        ],\n      },\n    ],\n  },\n  {\n    id: 'posters',\n    name: 'البوسترات والإعلانات',\n    icon: '🎨',\n    items: [\n      {\n        id: 'poster_conference',\n        title: 'بوستر مؤتمر إبداعي',\n        size: 'Poster',\n        description: 'بوستر فعاليات ومعارض فنية مع تباين لوني جريء',\n        previewBg: 'linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%)',\n        generator: (w, h) => [\n          mkR(0, 0, w, h, '#0f172a'),\n          mkR(40, 40, w - 80, h - 80, '#1e293b'),\n          mkT(60, 90, w - 120, 'المؤتمر السنوي للتصميم 2026', 56, '#38bdf8', 'Reem Kufi', 1, 'center'),\n          mkT(60, 175, w - 120, 'ملتقى المصممين والمطورين ورواد الأعمال الرقميين', 22, '#e2e8f0', 'Tajawal', 0, 'center'),\n          mkR(w / 2 - 120, 230, 240, 2, '#38bdf8'),\n          mkT(60, 320, w - 120, '3 أيام من ورش العمل التفاعلية\\nأكثر من 40 متحدثاً دولياً\\nمعرض خاص لأحدث الابتكارات', 28, '#ffffff', 'Cairo', 1, 'center'),\n          mkR(w / 2 - 140, h - 180, 280, 56, '#38bdf8'),\n          mkT(w / 2 - 140, h - 165, 280, 'سجل حضورك الآن مجاناً', 20, '#0f172a', 'Cairo', 1, 'center'),\n        ],\n      },\n    ],\n  },\n];\n", "src/services/multiUserSync.ts": "/**\n * @license\n * SPDX-License-Identifier: Apache-2.0\n */\n\nimport { DocData } from '../types/printStudio';\n\nexport interface Collaborator {\n  id: string;\n  name: string;\n  color: string;\n  activePageIndex: number;\n  selectedItemId: number | null;\n  lastSeen: number;\n}\n\nexport interface SyncMessage {\n  type: 'presence' | 'doc_update' | 'item_lock';\n  userId: string;\n  userName: string;\n  userColor: string;\n  version?: number;\n  doc?: DocData;\n  activePageIndex?: number;\n  selectedItemId?: number | null;\n}\n\nconst CHANNEL_NAME = 'print_studio_collab_bus';\n\nexport class MultiUserSyncService {\n  private channel: BroadcastChannel | null = null;\n  private currentUserId: string;\n  private currentUserName: string;\n  private currentUserColor: string;\n  private collaborators: Map<string, Collaborator> = new Map();\n  private onCollaboratorsChange?: (users: Collaborator[]) => void;\n  private onRemoteDocUpdate?: (remoteDoc: DocData) => void;\n\n  constructor() {\n    this.currentUserId = `user_${Math.random().toString(36).substring(2, 9)}`;\n    const colors = ['#d81b79', '#0284c7', '#10b981', '#f59e0b', '#8b5cf6'];\n    this.currentUserColor = colors[Math.floor(Math.random() * colors.length)];\n    this.currentUserName = `مستخدم ${Math.floor(Math.random() * 900 + 100)}`;\n\n    if (typeof window !== 'undefined' && 'BroadcastChannel' in window) {\n      this.channel = new BroadcastChannel(CHANNEL_NAME);\n      this.channel.onmessage = this.handleMessage.bind(this);\n    }\n  }\n\n  public init(\n    onCollaboratorsChange: (users: Collaborator[]) => void,\n    onRemoteDocUpdate: (remoteDoc: DocData) => void\n  ) {\n    this.onCollaboratorsChange = onCollaboratorsChange;\n    this.onRemoteDocUpdate = onRemoteDocUpdate;\n    this.broadcastPresence(0, null);\n\n    // Heartbeat every 4 seconds to clean stale collaborators\n    setInterval(() => {\n      this.broadcastPresence(0, null);\n      this.cleanupStaleCollaborators();\n    }, 4000);\n  }\n\n  public getUserId() {\n    return this.currentUserId;\n  }\n\n  public getUserName() {\n    return this.currentUserName;\n  }\n\n  public getUserColor() {\n    return this.currentUserColor;\n  }\n\n  public broadcastPresence(pageIndex: number, selectedItemId: number | null) {\n    if (!this.channel) return;\n    const msg: SyncMessage = {\n      type: 'presence',\n      userId: this.currentUserId,\n      userName: this.currentUserName,\n      userColor: this.currentUserColor,\n      activePageIndex: pageIndex,\n      selectedItemId,\n    };\n    try {\n      this.channel.postMessage(msg);\n    } catch (_) {}\n  }\n\n  public broadcastDocUpdate(doc: DocData) {\n    if (!this.channel) return;\n    const nextVersion = (doc.version || 1) + 1;\n    const updatedDoc: DocData = {\n      ...doc,\n      version: nextVersion,\n      lastModifiedBy: this.currentUserName,\n    };\n\n    const msg: SyncMessage = {\n      type: 'doc_update',\n      userId: this.currentUserId,\n      userName: this.currentUserName,\n      userColor: this.currentUserColor,\n      version: nextVersion,\n      doc: updatedDoc,\n    };\n    try {\n      this.channel.postMessage(msg);\n    } catch (_) {}\n    return updatedDoc;\n  }\n\n  private handleMessage(event: MessageEvent<SyncMessage>) {\n    const msg = event.data;\n    if (!msg || msg.userId === this.currentUserId) return;\n\n    if (msg.type === 'presence') {\n      this.collaborators.set(msg.userId, {\n        id: msg.userId,\n        name: msg.userName,\n        color: msg.userColor,\n        activePageIndex: msg.activePageIndex ?? 0,\n        selectedItemId: msg.selectedItemId ?? null,\n        lastSeen: Date.now(),\n      });\n      this.notifyCollaborators();\n    } else if (msg.type === 'doc_update' && msg.doc) {\n      if (this.onRemoteDocUpdate) {\n        this.onRemoteDocUpdate(msg.doc);\n      }\n    }\n  }\n\n  private cleanupStaleCollaborators() {\n    const now = Date.now();\n    let changed = false;\n    this.collaborators.forEach((collab, id) => {\n      if (now - collab.lastSeen > 9000) {\n        this.collaborators.delete(id);\n        changed = true;\n      }\n    });\n    if (changed) {\n      this.notifyCollaborators();\n    }\n  }\n\n  private notifyCollaborators() {\n    if (this.onCollaboratorsChange) {\n      this.onCollaboratorsChange(Array.from(this.collaborators.values()));\n    }\n  }\n\n  public destroy() {\n    if (this.channel) {\n      this.channel.close();\n      this.channel = null;\n    }\n  }\n}\n\nexport const multiUserSync = new MultiUserSyncService();\n", "src/services/iconsFonts.ts": "/**\n * @license\n * SPDX-Li
