<style>/* Tailwind is loaded from the CDN script in index.html */
:root {
  --bg: #e3e8f2;
  --bar: #f7f9fd;
  --fg: #0f1b3a;
  --mut: #5b6785;
  --bd: #c9d2e6;
  --ac: #1b2f6b;
  --acf: #ffffff;
  --sel: #00a3d9;
  --row: #e9eef8;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
:root[data-theme="dark"] {
  --bg: #0a1226;
  --bar: #101b36;
  --fg: #e8edf8;
  --mut: #93a0bd;
  --bd: #26365a;
  --ac: #5b86f5;
  --acf: #07102a;
  --sel: #38bdf8;
  --row: #17254a;
}
:root[data-theme="light"] {
  --bg: #e3e8f2;
  --bar: #f7f9fd;
  --fg: #0f1b3a;
  --mut: #5b6785;
  --bd: #c9d2e6;
  --ac: #1b2f6b;
  --acf: #ffffff;
  --sel: #00a3d9;
  --row: #e9eef8;
}

html, body {
  height: 100%;
  margin: 0;
  background-color: var(--bg);
  color: var(--fg);
  font-family: Tajawal, "Segoe UI", Tahoma, sans-serif;
  user-select: none;
  -webkit-user-select: none;
}

input, textarea, select, [contenteditable="true"], .select-text, .t {
  user-select: text !important;
  -webkit-user-select: text !important;
}

#root {
  height: 100%;
  display: flex;
  flex-direction: column;
}

.ps-bar {
  background: var(--bar);
  display: flex;
  gap: 6px;
  align-items: center;
  padding: 6px 8px;
  overflow-x: auto;
  flex: none;
  scrollbar-width: none;
}
.ps-bar::-webkit-scrollbar {
  display: none;
}

.ps-btn, .ps-select, .ps-input {
  font: inherit;
  color: var(--fg);
  background: transparent;
  border: 1px solid var(--bd);
  border-radius: 9px;
  padding: 6px 11px;
  min-height: 40px;
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background-color 0.15s, border-color 0.15s;
}

.ps-btn:hover {
  background: var(--row);
}

.ps-btn:focus-visible, .ps-select:focus-visible, .ps-input:focus-visible {
  outline: 2px solid var(--sel);
  outline-offset: 1px;
}

.ps-btn-primary {
  background: var(--ac) !important;
  color: var(--acf) !important;
  border-color: var(--ac) !important;
  font-weight: 700;
}
.ps-btn-primary:hover {
  opacity: 0.92;
}

.ps-chip {
  background: var(--row);
  border-color: transparent;
  font-weight: 500;
}

.ps-dock-btn {
  border: 0 !important;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  min-width: 54px;
  font-size: 11px;
  padding: 4px 6px;
  border-radius: 9px;
  cursor: pointer;
  color: var(--fg);
  background: transparent;
}
.ps-dock-btn:hover {
  background: var(--row);
}
.ps-dock-btn.act {
  background: var(--ac);
  color: var(--acf);
}
.ps-dock-btn b {
  font-size: 18px;
  line-height: 1;
  font-weight: 400;
}

.ps-stage {
  flex: 1;
  overflow: auto;
  display: flex;
  padding: 14px;
  touch-action: pan-x pan-y;
  position: relative;
}

.ps-page {
  position: absolute;
  top: 0;
  left: 0;
  background: #ffffff;
  box-shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.2);
  transform-origin: 0 0;
  overflow: hidden;
  direction: ltr;
  color: #111;
}

.it {
  position: absolute;
  touch-action: none;
  box-sizing: border-box;
}

.it.sel {
  outline: 2px solid var(--sel);
  outline-offset: 1px;
}

.it img, .it svg {
  width: 100%;
  height: 100%;
  display: block;
  pointer-events: none;
}

.it .t {
  width: 100%;
  line-height: 1.25;
  white-space: pre-wrap;
  word-break: break-word;
  unicode-bidi: plaintext;
  outline: none;
}

.it.editing {
  z-index: 40 !important;
}

.it .t[contenteditable="true"],
.it.editing,
.it.editing .t,
.it.editing textarea {
  user-select: text !important;
  -webkit-user-select: text !important;
  cursor: text !important;
  outline: 2px dashed var(--ac) !important;
  outline-offset: 2px !important;
  background: rgba(27, 47, 107, 0.10);
  border-radius: 4px;
}

.resize-handle {
  position: absolute;
  right: -10px;
  bottom: -10px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--sel);
  border: 2px solid #fff;
  touch-action: none;
  cursor: se-resize;
  z-index: 10;
}

.sw {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 2px solid var(--bd);
  flex: none;
  padding: 0;
  min-height: 0;
  cursor: pointer;
}

.sep {
  width: 1px;
  height: 26px;
  background: var(--bd);
  flex: none;
}

.sheet-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.48);
  backdrop-filter: blur(2px);
  display: flex;
  align-items: flex-end;
  z-index: 50;
}

.sheet-card {
  background: var(--bar);
  width: 100%;
  max-height: 80vh;
  border-radius: 20px 20px 0 0;
  display: flex;
  flex-direction: column;
  box-shadow: 0 -4px 24px rgba(0,0,0,0.25);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

.sheet-row {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--row);
  border-radius: 11px;
  padding: 10px 14px;
  cursor: pointer;
  min-height: 44px;
  border: 1px solid transparent;
  transition: all 0.15s;
}

.sheet-row:hover {
  background: var(--bd);
}

.sheet-row.on {
  border-color: var(--ac);
  background: color-mix(in srgb, var(--ac) 10%, var(--row));
}

.sheet-row small {
  color: var(--mut);
  margin-inline-start: auto;
}


@media (max-width: 768px) {
  #root { height: 100dvh; }
  .ps-bar > * { flex-shrink: 0; }
  footer.ps-bar { justify-content: flex-start !important; }
  .ps-dock-btn { min-width: 50px; }
  .ps-stage { padding: 8px; }
  .resize-handle { width: 30px; height: 30px; right: -15px; bottom: -15px; }
}
@media (pointer: coarse) {
  input[type="range"] { min-height: 28px; }
  .ps-btn, .ps-select { min-height: 42px; }
}

#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font:16px Tajawal,sans-serif;color:#6b7280;background:#e3e8f2;z-index:50}
#err{position:fixed;inset:0;overflow:auto;background:#fff;color:#a32d2d;padding:16px;font:13px monospace;white-space:pre-wrap;z-index:60;display:none;direction:ltr}
</style></head>

<script id="src" type="application/json">{"src/App.tsx": "/**\n * @license\n * SPDX-License-Identifier: Apache-2.0\n */\n\nimport React, { useEffect, useRef, useState, useCallback } from 'react';\nimport { DocData, Item, SavedProject, DesignIssue } from './types/printStudio';\nimport { CanvaSidebar } from './components/CanvaSidebar';\nimport { AIAssistant } from './components/AIAssistant';\nimport { DesignAuditOverlay } from './components/DesignAuditOverlay';\nimport { NewDocModal } from './components/NewDocModal';\nimport { DeveloperTemplateModal } from './components/DeveloperTemplateModal';\nimport { LayoutGridModal } from './components/LayoutGridModal';\nimport { layoutText, drawImageFit } from './services/textLayout';\nimport { FrameInspector } from './components/FrameInspector';\nimport { StagePanBars } from './components/StagePanBars';\nimport { PagesPanel } from './components/PagesPanel';\nimport { kvGet, kvSet, requestPersistence } from './services/storage';\nimport { exportPptx, exportPsdPage } from './services/exporters';\nimport { auditDesign } from './services/designAuditor';\nimport { TEMPLATE_CATEGORIES } from './services/templatesData';\nimport { multiUserSync, Collaborator } from './services/multiUserSync';\nimport { Language, getT } from './services/i18n';\n\ndeclare global {\n  interface Window {\n    jspdf?: {\n      jsPDF: any;\n    };\n  }\n}\n\nconst MM = 2.8346;\n\nconst SIZES: [string, string, number, number][] = [\n  ['A4', 'A4 · 210×297 مم', 595.3, 841.9],\n  ['A5', 'A5 · 148×210 مم', 419.5, 595.3],\n  ['Card', 'Card بطاقة عمل · 90×50 مم', 255.1, 141.7],\n  ['Flyer', 'Flyer فلاير · 99×210 مم', 280.6, 595.3],\n  ['Poster', 'Poster بوستر · A3', 841.9, 1190.6],\n  ['Post', 'Post منشور مربع · 1:1', 600, 600],\n  ['Story', 'Story ستوري · 9:16', 540, 960],\n  ['Letter', 'Letter · 8.5×11 إنش', 612, 792],\n];\n\nconst FONTS: [string, string][] = [\n  ['Cairo', 'عربي ولاتيني'],\n  ['Tajawal', 'عربي ولاتيني'],\n  ['Amiri', 'عربي · نسخ كلاسيكي'],\n  ['Reem Kufi', 'عربي · كوفي'],\n  ['Playfair Display', 'Latin · serif'],\n  ['Montserrat', 'Latin · sans'],\n  ['Oswald', 'Latin · condensed'],\n  ['Lobster', 'Latin · script'],\n  ['Almarai', 'عربي رسمي'],\n  ['El Messiri', 'عربي فني'],\n];\n\nexport default function App() {\n  const [lang, setLang] = useState<Language>('ar');\n  const t = getT(lang);\n  const isAr = lang === 'ar';\n\n  const [doc, setDoc] = useState<DocData>(() => ({\n    name: 'مشروع استوديو المطبوعات',\n    w: 595.3,\n    h: 841.9,\n    size: 'A4',\n    intent: 'print',\n    colorMode: 'CMYK',\n    facingPages: true,\n    binding: 'rtl',\n    bleed: 3,\n    margins: { top: 12, bottom: 12, inside: 15, outside: 12 },\n    columns: 3,\n    gutter: 4,\n    showGrid: true,\n    pages: [{ id: 'p1', m: '', items: [] }],\n    masters: { A: [], B: [] },\n    version: 1,\n  }));\n\n  const [IM, setIM] = useState<Record<string, string>>({});\n  const [view, setView] = useState<{ t: 'p' | 'm'; i: number; k?: 'A' | 'B' }>({ t: 'p', i: 0 });\n  const [sel, setSel] = useState<number | null>(null);\n  const [tool, setTool] = useState<'sel' | 'textFrame' | 'imgFrame' | 'pen' | 'drop'>('sel');\n  const [fitScale, setFitScale] = useState<number>(1);\n  const [zoom, setZoom] = useState<number>(1);\n  const scale = fitScale * zoom;\n  const zoomRef = useRef(1);\n  zoomRef.current = zoom;\n  const pinchRef = useRef(false);\n  const pendingScroll = useRef<{ l: number; t: number } | null>(null);\n  const toolRef = useRef<string>('sel');\n  toolRef.current = tool;\n  const [col, setCol] = useState<string>('#1b2f6b');\n  const [recent, setRecent] = useState<string[]>([\n    '#14161a',\n    '#ffffff',\n    '#1b2f6b',\n    '#0284c7',\n    '#f59e0b',\n    '#10b981',\n  ]);\n  const [defFam, setDefFam] = useState<string>('Cairo');\n  const [hist, setHist] = useState<string[]>([]);\n  const [toastMsg, setToastMsg] = useState<string | null>(null);\n  const [theme, setTheme] = useState<'light' | 'dark' | 'auto'>(() => {\n    try {\n      const v = localStorage.getItem('ps_theme');\n      if (v === 'light' || v === 'dark' || v === 'auto') return v;\n    } catch (_) {}\n    return 'auto';\n  });\n  useEffect(() => {\n    const mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;\n    const apply = () => {\n      const eff = theme === 'auto' ? (mq && mq.matches ? 'dark' : 'light') : theme;\n      document.documentElement.setAttribute('data-theme', eff);\n      const meta = document.querySelector('meta[name=\"theme-color\"]');\n      if (meta) meta.setAttribute('content', eff === 'dark' ? '#101b36' : '#1b2f6b');\n    };\n    apply();\n    try {\n      localStorage.setItem('ps_theme', theme);\n    } catch (_) {}\n    if (mq && mq.addEventListener) mq.addEventListener('change', apply);\n    return () => {\n      if (mq && mq.removeEventListener) mq.removeEventListener('change', apply);\n    };\n  }, [theme]);\n\n  // Canva Sidebar State\n  const [showInspector, setShowInspector] = useState(false);\n  const [isSidebarOpen, setIsSidebarOpen] = useState(() => (typeof window === 'undefined' ? true : window.innerWidth >= 768));\n  const [sidebarTab, setSidebarTab] = useState<'templates' | 'elements' | 'typography' | 'photos' | 'iconsFonts' | 'layers' | 'pages' | 'projects'>('templates');\n\n  // Interactive Frame Drawing Box State (Click & Drag Text / Image Frame)\n  const [drawingBox, setDrawingBox] = useState<{\n    type: 'text' | 'img';\n    startX: number;\n    startY: number;\n    curX: number;\n    curY: number;\n  } | null>(null);\n\n  // Layout & Column Grid Settings Modal\n  const [showLayoutModal, setShowLayoutModal] = useState(false);\n\n  // Inline text editing state\n  const [editingTextId, setEditingTextId] = useState<number | null>(null);\n\n  // AI Modal State\n  const [aiModalItem, setAiModalItem] = useState<Item | null>(null);\n  const [aiGlobalOpen, setAiGlobalOpen] = useState(false);\n\n  // Design Auditor State\n  const [isAuditorActive, setIsAuditorActive] = useState(false);\n  const [auditIssues, setAuditIssues] = useState<DesignIssue[]>([]);\n\n  // New Doc Wizard State\n  const [showNewDocModal, setShowNewDocModal] = useState(false);\n\n  // Developer Template Studio Modal State\n  const [showDevTemplateModal, setShowDevTemplateModal] = useState(false);\n\n  // Multi-user Collaborators State\n  const [collaborators, setCollaborators] = useState<Collaborator[]>([]);\n\n  // Projects State\n  const [savedProjects, setSavedProjects] = useState<SavedProject[]>([]);\n  const [lastAutoSavedTime, setLastAutoSavedTime] = useState<string>('الآن');\n\n  // Export Modal Sheet\n  const [sheet, setSheet] = useState<{ open: boolean; title: string; content: React.ReactNode | null }>({\n    open: false,\n    title: '',\n    content: null,\n  });\n\n  const stageRef = useRef<HTMLDivElement>(null);\n  const pageRef = useRef<HTMLDivElement>(null);\n  const fileInputRef = useRef<HTMLInputElement>(null);\n  const uidRef = useRef<number>(1);\n  const measureCanvasRef = useRef<CanvasRenderingContext2D | null>(null);\n  const cachedImgs = useRef<Record<string, Promise<HTMLImageElement>>>({});\n  const toastTimeoutRef = useRef<any>(null);\n\n  const toast = useCallback((msg: string) => {\n    setToastMsg(msg);\n    if (toastTimeoutRef.current) clearTimeout(toastTimeoutRef.current);\n    toastTimeoutRef.current = setTimeout(() => setToastMsg(null), 2500);\n  }, []);\n\n  const getMeasureContext = () => {\n    if (!measureCanvasRef.current) {\n      const canvas = document.createElement('canvas');\n      measureCanvasRef.current = canvas.getContext('2d');\n    }\n    return measureCanvasRef.current!;\n  };\n\n  const getImg = (k: string): Promise<HTMLImageElement> => {\n    if (k in cachedImgs.current) return cachedImgs.current[k];\n    const p = new Promise<HTMLImageElement>((resolve) => {\n      const img = new Image();\n      const srcUrl = IM[k] || k;\n      const remote = /^https?:/i.test(srcUrl);\n      if (remote) img.crossOrigin = 'anonymous';\n      img.onload = () => resolve(img);\n      img.onerror = () => {\n        if (remote) toast(isAr ? 'تعذّر تحميل صورة من موقع خارجي (قد يمنع الموقع استخدامها في التصدير). استُبدلت بصورة بديلة، حمّل الصورة من جهازك.' : 'An external image could not be loaded for export and was replaced by a placeholder. Upload it from your device.');\n        const cv = document.createElement('canvas');\n        cv.width = 200;\n        cv.height = 200;\n        const cx = cv.getContext('2d');\n        if (cx) {\n          cx.fillStyle = '#1e293b';\n          cx.fillRect(0, 0, 200, 200);\n          cx.fillStyle = '#94a3b8';\n          cx.font = '14px sans-serif';\n          cx.textAlign = 'center';\n          cx.fillText('Image', 100, 105);\n        }\n        const fb = new Image();\n        fb.src = cv.toDataURL();\n        fb.onload = () => resolve(fb);\n      };\n      img.src = IM[k] || k;\n    });\n    cachedImgs.current[k] = p;\n    return p;\n  };\n\n  const currentItems = useCallback((): Item[] => {\n    if (view.t === 'p') {\n      return doc.pages[view.i]?.items || [];\n    }\n    return doc.masters[view.k || 'A'] || [];\n  }, [doc, view]);\n\n  const getSelectedItem = useCallback((): Item | undefined => {\n    return currentItems().find((i) => i.id === sel);\n  }, [currentItems, sel]);\n\n  // Autosave is state-driven (see \"Persistence\" below); kept as a no-op for call-site compatibility.\n  const saveToStorage = useCallback((_newDoc?: DocData, _newIM?: Record<string, string>, _newView?: any) => {}, []);\n\n  const snap = useCallback(() => {\n    setHist((prev) => {\n      const s = JSON.stringify({ doc, view });\n      if (prev.length && prev[prev.length - 1] === s) return prev; // avoid duplicate undo steps\n      const next = [...prev, s];\n      if (next.length > 50) next.shift();\n      return next;\n    });\n  }, [doc, view]);\n\n  // Multi-user & Multi-tab Sync Setup\n  useEffect(() => {\n    multiUserSync.init(\n      (users) => {\n        se ng) => {\n    snap();\n    setDoc((prev) => {\n      const nd = { ...prev, pages: prev.pages.map((p) => ({ ...p, m: k })) };\n      saveToStorage(nd);\n      return nd;\n    });\n    toast(isAr ? `طُبّق ${k}-Master على كل الصفحات` : `${k}-Master applied to all pages`);\n  };\n  const addMasterItem = (k: 'A' | 'B', kind: 'pageNumber' | 'header' | 'footer' | 'line') => {\n    snap();\n    const mt = (doc.margins?.top ?? 12) * MM;\n    const mb = (doc.margins?.bottom ?? 12) * MM;\n    const ms = (doc.margins?.outside ?? 12) * MM;\n    const id = uidRef.current++;\n    const base: Item = { id, type: 'text', x: ms, y: 0, w: doc.w - 2 * ms, h: 20, color: '#555555', fs: 11, fam: defFam || 'Cairo', a: 'start' };\n    let it: Item;\n    if (kind === 'pageNumber') it = { ...base, x: (doc.w - 60) / 2, w: 60, y: doc.h - mb / 2 - 9, text: '‹#›', a: 'center', fs: 12, name: isAr ? 'رقم الصفحة' : 'Page number' };\n    else if (kind === 'header') it = { ...base, y: Math.max(6, mt / 2 - 8), text: isAr ? 'عنوان الوثيقة' : 'Document title', name: isAr ? 'رأس الصفحة' : 'Header' };\n    else if (kind === 'footer') it = { ...base, y: doc.h - mb / 2 - 9, w: (doc.w - 2 * ms) / 2, text: isAr ? 'اسم الجهة' : 'Organisation', name: isAr ? 'ذيل الصفحة' : 'Footer' };\n    else it = { id, type: 'rect', x: ms, y: Math.max(8, mt - 4), w: doc.w - 2 * ms, h: 0.75, color: '#9aa1ae', name: isAr ? 'خط فاصل' : 'Rule' };\n    setDoc((prev) => {\n      const nd = { ...prev, masters: { ...prev.masters, [k]: [...(prev.masters[k] || []), it] } };\n      saveToStorage(nd);\n      return nd;\n    });\n    toast(isAr ? `أُضيف إلى ${k}-Master ويظهر على كل صفحاته` : `Added to ${k}-Master`);\n  };\n\n  const selectedItem = getSelectedItem();\n  const pageNumStr = view.t === 'm' ? '‹#›' : String(view.i + 1);\n\n  return (\n    <div\n      dir={isAr ? 'rtl' : 'ltr'}\n      className=\"h-full flex flex-col overflow-hidden bg-[var(--bg)] text-[var(--fg)]\"\n      data-theme={theme === 'auto' ? undefined : theme}\n    >\n      {/* Top Header Bar */}\n      <header className=\"ps-bar border-b border-[var(--bd)] justify-between px-2 sm:px-4\">\n        <div className=\"flex items-center gap-1.5 shrink-0 overflow-x-auto scrollbar-none\">\n          {/* Slide in / out drawer toggle button */}\n          <button\n            className={`ps-btn text-xs py-1 px-2.5 font-bold transition-all flex items-center gap-1.5 ${\n              isSidebarOpen ? 'bg-[var(--ac)] text-[var(--acf)] shadow-sm' : 'bg-[var(--row)] hover:bg-[var(--bd)]'\n            }`}\n            onClick={() => setIsSidebarOpen(!isSidebarOpen)}\n            title={isSidebarOpen ? (isAr ? 'طي شريط القوالب للداخل' : 'Retract sidebar') : (isAr ? 'إخراج شريط القوالب' : 'Slide out sidebar')}\n          >\n            <span>⊞<\/span>\n            <span>{isAr ? 'القوالب' : 'Templates'}<\/span>\n            <span className=\"text-[10px] opacity-75\">{isSidebarOpen ? (isAr ? '‹' : '›') : (isAr ? '›' : '‹')}<\/span>\n          <\/button>\n\n          <button\n            className=\"ps-btn text-xs py-1 px-2.5 font-bold bg-[var(--row)]\"\n            onClick={() => setShowNewDocModal(true)}\n            title=\"إنشاء مستند جديد\"\n          >\n            📄 {t('newFile')}\n          <\/button>\n\n          <div className=\"flex items-center bg-[var(--row)] rounded-lg p-0.5 border border-[var(--bd)] text-xs\">\n            <span className=\"font-semibold px-2 py-0.5\">{doc.size}<\/span>\n            <span className=\"text-[10px] text-[var(--mut)] px-1 border-r border-[var(--bd)]\">\n              {doc.colorMode} · {doc.facingPages ? t('facingPages') : t('singlePages')}\n            <\/span>\n          <\/div>\n\n          {/* Layout & Column Grid Settings Button */}\n          <button\n            className=\"ps-btn text-xs py-1 px-2.5 font-bold bg-[var(--row)] hover:bg-[var(--bd)] flex items-center gap-1.5\"\n            onClick={() => setShowLayoutModal(true)}\n            title={isAr ? 'تعديل أعمدة الصفحة والهوامش وفواصل Gutter' :  onAddItem={addItem}\n          onDeleteItem={(id) => {\n            snap();\n            updateItems((items) => items.filter((x) => x.id !== id));\n            if (sel === id) {\n              setSel(null);\n              setEditingTextId(null);\n            }\n            toast(isAr ? 'تم حذف الطبقة 🗑️' : 'Layer deleted 🗑️');\n          }}\n          onDuplicateItem={(id) => {\n            snap();\n            const target = currentItems().find((x) => x.id === id);\n            if (target) {\n              const copy = JSON.parse(JSON.stringify(target));\n              copy.id = uidRef.current++;\n              copy.x += 16;\n              copy.y += 16;\n              updateItems((items) => [...items, copy]);\n              setSel(copy.id);\n              toast(isAr ? 'تم تكرار الطبقة ⧉' : 'Layer duplicated ⧉');\n            }\n          }}\n          onApplyTemplate={(newItems) => {\n            let maxId = uidRef.current;\n            newItems.forEach((it) => (it.id = maxId++));\n            uidRef.current = maxId;\n            updateItems(() => newItems);\n            const mainText =\n              newItems.find((x) => x.type === 'text' && (x.fs || 0) >= 30) ||\n              newItems.find((x) => x.type === 'text');\n            if (mainText) {\n              setSel(mainText.id);\n            } else {\n              setSel(null);\n            }\n            setEditingTextId(null);\n            setTool('sel');\n          }}\n          onUpdateItems={updateItems}\n          onSaveProject={handleSaveProject}\n          savedProjects={savedProjects}\n          onLoadProject={(p) => {\n            loadProject(p);\n            toast(`تم فتح مشروع «${p.name}»`);\n          }}\n          onDeleteProject={handleDeleteProject}\n          onExportMobileFile={handleExportMobileFile}\n          onOpenDeveloperStudio={() => setShowDevTemplateModal(true)}\n          lastAutoSavedTime={lastAutoSavedTime}\n          toast={toast}\n          lang={lang}\n          onUploadImage cked, InDesign-style) + labels */}\n            {view.t === 'p' &&\n              doc.pages.length > 1 &&\n              doc.pages.map((pg, i) => (\n                <React.Fragment key={'pgx' + (pg.id || i)}>\n                  {i !== view.i && (\n                    <StaticPage\n                      pg={pg}\n                      masterItems={pg.m ? doc.masters[pg.m] : undefined}\n                      index={i}\n                      w={doc.w}\n                      h={doc.h}\n                      scale={scale}\n                      top={pageTop(i)}\n                      IM={IM}\n                      tool={tool}\n                      lay={lay}\n                      pd={pd}\n                      measureCtx={getMeasureContext()}\n                      onPick={() => {\n                        if (tool === 'sel') {\n                          setView({ t: 'p', i });\n                          setSel(null);\n                          setEditingTextId(null);\n                        }\n                      }}\n                    />\n                  )}\n                  <div\n                    style={{\n                      position: 'absolute',\n                      left: 0,\n                      top: `${pageTop(i) + doc.h * scale + 4}px`,\n                      width: `${doc.w * scale}px`,\n                      textAlign: 'center',\n                      fontSize: 11,\n                      fontWeight: i === view.i ? 700 : 400,\n                      color: i === view.i ? 'var(--ac)' : 'var(--mut)',\n                      pointerEvents: 'none',\n                    }}\n                  >\n                    {isAr ? `صفحة ${i + 1}` : `Page ${i + 1}`}\n                    {pg.m ? ` · ${pg.m}-Master` : ''}\n                  <\/div>\n                <\/React.Fragment>\n              ))}\n\n            {/* The Document Page */}\n            <div\n              ref={pageRef}\n              className=\"ps-page relative shadow-2xl transition-shadow\"\n              style={{\n                position: 'absolute',\n                left: 0,\n                top: `${activeTop}px`,\n                outline: view.t === 'p' && doc.pages.length > 1 ? '2px solid var(--sel)' : undefined,\n                width: `${doc.w}px`,\n                height: `${doc.h}px`,\n                transform: `scale(${scale})`,\n                touchAction: tool === 'pen' ? 'none' : 'auto',\n                cursor:\n                  tool === 'textFrame' || tool === 'imgFrame' || tool === 'pen'\n                    ? 'crosshair'\n                    : tool === 'drop'\n                    ? 'cell'\n                    : 'default',\n              }}\n              onPointerDown={(e) => {\n                if (tool === 'pen') {\n                  e.preventDefault();\n                  e.stopPropagation();\n                  startPen(e);\n                } else if (tool === 'drop') {\n                  e.preventDefault();\n                  e.stopPropagation();\n                  pickColor(e);\n                } else if (tool === 'textFrame' || tool === 'imgFrame') {\n                  e.preventDefault();\n                  e.stopPropagation();\n                  startDrawFrame(e);\n                }\n              }}\n            >\n              {/* Bleed Safety Line */}\n              {doc.bleed > 0 && (\n                <div\n                  className=\"absolute inset-0 pointer-events-none border border-dashed border-rose-400/40 z-10\"\n                  style={{ margin: `${doc.bleed * MM}px` }}\n                  title=\"خط الأمان للهامش الخارجي والقص (Bleed)\"\n                />\n              )}\n\n              {/* Column Grid & Margin Guides (InDesign Style) */}\n              {doc.showGrid !== false && (\n                <div className=\"absolute inset-0 pointer-events-none z-10 overflow-hidden\">\n                  {/* Margin Boundary Box */}\n                  <div\n                    className=\"absolute border border-blue-500/40 bor  number }; // in mm\n  columns?: number; // number of columns (1, 2, 3, 4, 6...)\n  gutter?: number; // gutter width in mm between columns\n  showGrid?: boolean; // toggle visibility of column guides & margins\n  version?: number;\n  lastModifiedBy?: string;\n}\n\nexport interface DocData extends DocSettings {\n  pages: PageData[];\n  masters: {\n    A: Item[];\n    B: Item[];\n    [key: string]: Item[];\n  };\n}\n\nexport interface DeveloperTemplate {\n  id: string;\n  title: string;\n  category: 'magazines' | 'newspapers' | 'identity' | 'posters' | 'custom';\n  description: string;\n  previewBg: string;\n  size: string;\n  items: Item[];\n  author?: string;\n  createdAt: number;\n}\n\nexport interface DesignIssue {\n  id: string;\n  type: 'contrast' | 'bleed' | 'hierarchy' | 'alignment' | 'clutter';\n  severity: 'error' | 'warning' | 'info';\n  title: string;\n  description: string;\n  advice: string;\n  x: number;\n  y: number;\n  w: number;\n  h: number;\n  itemId?: number;\n  canAutoFix?: boolean;\n  autoFixAction?: () => void;\n}\n\nexport interface SavedProject {\n  id: string;\n  name: string;\n  updatedAt: number;\n  doc: DocData;\n  IM: Record<string, string>;\n}\n", "src/components/CanvaSidebar.tsx": "/**\n * @license\n * SPDX-License-Identifier: Apache-2.0\n */\n\nimport React, { useState } from 'react';\nimport { DocData, Item, SavedProject, DeveloperTemplate } from '../types/printStudio';\nimport { TEMPLATE_CATEGORIES } from '../services/templatesData';\nimport { STOCK_PHOTOS, StockPhoto } from '../services/stockMedia';\nimport { STOCK_ICONS, AVAILABLE_FONTS, loadGoogleFont } from '../services/iconsFonts';\nimport { IconBrowser } from './IconBrowser';\nimport { kvGet } from '../services/storage';\nimport { Language, getT } from '../services/i18n';\n\ninterface CanvaSidebarProps {\n  isOpen: boolean;\n  onToggle: () => void;\n  pagesPanel?: React.ReactNode;\n  activeTab: 'templates' | 'elements' | 'typography' | 'photos' | 'iconsFonts' | 'layers' | 'pages' | 'projects';\n  onTabChange: (tab: 'templates' | 'elements' | 'typography' | 'photos' | 'iconsFonts' | 'layers' | 'pages' | 'projects') => void;\n  doc: DocData;\n  currentPageItems: Item[];\n  selectedItemId: number | null;\n  onSelectItem: (id: number) => void;\n  onAddItem: (item: Partial<Item>) => void;\n  onDeleteItem: (id: number) => void;\n  onDuplicateItem?: (id: number) => void;\n  onApplyTemplate: (items: Item[]) => void;\n  onUpdateItems: (callback: (items: Item[]) => Item[]) => void;\n  onSaveProject: (name: string) => void;\n  savedProjects: SavedProject[];\n  onLoadProject: (proj: SavedProject) => void;\n  onDeleteProject: (id: string) => void;\n  onExportMobileFile: () => void;\n  onOpenDeveloperStudio: () => void;\n  lastAutoSavedTime: string;\n  toast: (m: string) => void;\n  lang: Language;\n  onUploadImageClick: () => void;\n}\n\nexport function CanvaSidebar({\n  isOpen,\n  pagesPanel,\n  onToggle,\n  activeTab,\n  onTabChange,\n  doc,\n  currentPageItems,\n  selectedItemId,\n  onSelectItem,\n  onAddItem,\n  onDeleteItem,\n  onDuplicateItem,\n  onApplyTemplate,\n  onUpdateItems,\n  onSaveProject,\n  savedProjects,\n  onLoadProject,\n  onDeleteProject,\n  onExportMobileFile,\n  onOpenDeveloperStudio,\n  lastAutoSavedTime,\n  toast,\n  lang,\n  onUploadImageClick,\n}: CanvaSidebarProps) {\n  const t = getT(lang);\n  const isAr = lang === 'ar';\n\n  const [selectedCategory, setSelectedCategory] = useState<string>('magazines');\n  const [newProjectName, setNewProjectName] = useState<string>('');\n\n  // Photos Tab Search & Category\n  const [photoSearch, setPhotoSearch] = useState<string>('');\n  const [photoCategory, setPhotoCategory] = useState<string>('all');\n\n  // Icons Tab Search\n  const [iconSearch, setIconSearch] = useState<string>('');\n\n  // Custom Font Input\n  const [customFontInput, setCustomFontInput] = useState<string>('');\n\n  // Editing layer name inline\n  const [editingLayerId, setEditingLayerId] = useState<number | null>(null);\n  const [editingLayerName, setEditingLayerName] = useState<string>('');\n\n  // Registered Developer Templates loaded from storage\n  const [devTemplates, setDevTemplates] = useState<DeveloperTemplate[]>([]);\n\n  React.useEffect(() => {\n    const load = () =>\n      kvGet<DeveloperTemplate[]>('ps_dev_templates')\n        .then((v) => {\n          if (Array.isArray(v)) setDevTemplates(v);\n        })\n        .catch(() => {});\n    load();\n    window.addEventListener('ps-templates-changed', load);\n    return () => window.removeEventListener('ps-templates-changed', load);\n  }, [isOpen]);\n\n  // Handle Layer Reordering\n  const moveLayer = (itemId: number, direction: 'up' | 'down') => {\n    onUpdateItems((items) => {\n      const arr = [...items];\n      const idx = arr.findIndex((x) => x.id === itemId);\n      if (idx === -1) return arr;\n      const targetIdx = direction === 'up' ? idx + 1 : idx - 1;\n      if (targetIdx < 0 || targetIdx >= arr.length) return arr;\n\n      const [moved] = arr.splice(idx, 1);\n      arr.splice(targetIdx, 0, moved);\n      return arr;\n    });\n  };\n\n  // Group Selected Items or Create New Group\n  const handleGroupSelected = () => {\n    if (!selectedItemId) {\n      toast(isAr ? 'حدد عنصراً أولاً لتجميعه' : 'Select an item first to group');\n      return;\n    }\n    const groupId = `grp_${Date.now()}`;\n    onUpdateItems((items) =>\n      items.map((x) => (x.id === selectedItemId ? { ...x, groupId, name: isAr ? 'مجموعة مجمعة' : 'Grouped Item' } : x))\n    );\n    toast(isAr ? 'تم ضم العنصر لمجموعة جديدة' : 'Item grouped');\n  };\n\n  const handleUngroup = (itemId: number) => {\n    onUpdateItems((items) =>\n      items.map((x) => (x.id === itemId ? { ...x, groupId: undefined } : x))\n    );\n    toast(isAr ? 'تم فك التجميع' : 'Ungrouped');\n  };\n\n  // Save renamed layer\n  const saveLayerName = (itemId: number) => {\n    if (editingLayerName.trim()) {\n      onUpdateItems((items) =>\n        items.map((x) => (x.id === itemId ? { ...x, name: editingLayerName.trim() } : x))\n      );\n    }\n    setEditingLayerId(null);\n  };\n\n  // Handle adding stock image\n  const handleAddStockPhoto = (photo: StockPhoto) => {\n    onAddItem({\n      type: 'img',\n      k: photo.url, // URL as key or direct src\n      name: isAr ? photo.title : photo.titleEn,\n      w: doc.w * 0.5,\n      h: doc.w * 0.4,\n    });\n    toast(isAr ? `تمت إضافة صورة ${photo.title}` : `Added ${photo.titleEn}`);\n  };\n\n  // Handle adding custom SVG icon\n  const handleAddIcon = (icon: typeof STOCK_ICONS[0]) => {\n    onAddItem({\n      type: 'path',\n      name: isAr ? icon.name : icon.nameEn,\n      w: 48,\n      h: 48,\n      pw: 24,\n      ph: 24,\n      sw: 2,\n      color: '#1b2f6b',\n      pts: [[2, 2], [22, 22]], // Fallback points\n    });\n    toast(isAr ? `تمت إضافة أيقونة ${icon.name}` : `Added ${icon.nameEn}`);\n  };\n\n  // Filtered Stock Photos\n  const filteredPhotos = STOCK_PHOTOS.filter((p) => {\n    const matchesCat = photoCategory === 'all' || p.category === photoCategory;\n    const term = photoSearch.trim().toLowerCase();\n    const matchesSearch =\n      !term ||\n      p.title.toLowerCase().includes(term) ||\n      p.titleEn.toLowerCase().includes(term) ||\n      p.tags.some((tag) => tag.toLowerCase().includes(term));\n    return matchesCat && matchesSearch;\n  });\n\n  // Filtered Icons\n  const filteredIcons = STOCK_ICONS.filter((ic) => {\n    const term = iconSearch.trim().toLowerCase();\n    return !term || ic.name.toLowerCase().includes(term) || ic.nameEn.toLowerCase().includes(term);\n  });\n\n  // Tab click toggle: opens drawer if closed, or retracts inside if clicking the active tab\n  const handleTabClick = (tab: typeof activeTab) => {\n    if (isOpen && activeTab === tab) {\n      onToggle();\n    } else {\n      onTabChange(tab);\n      if (!isOpen) {\n        onToggle();\n      }\n    }\n  };\n\n  return (\n    <aside className={`bg-[var(--bar)] border-l border-[var(--bd)] flex shrink-0 z-20 shadow-lg h-full overflow-hidden transition-all duration-300 ease-in-out max-md:absolute max-md:inset-y-0 max-md:start-0 ${isOpen ? '' : 'max-md:hidden'}`}>\n      {/* Icon Rail Navigation - Always docked */}\n      <div className=\"w-14 md:w-16 overflow-y-auto bg-[var(--row)] border-l border-[var(--bd)] flex flex-col items-center py-2.5 gap-1.5 shrink-0 z-20\">\n        <button\n          onClick={() => handleTabClick('templates')}\n          className={`w-12 h-11 flex flex-col items-center justify-center rounded-xl text-[10px] gap-0.5 transition-all ${\n            isOpen && activeTab === 'templates'\n              ? 'bg-[var(--ac)] text-[var(--acf)] font-bold shadow-sm'\n              : 'text-[var(--mut)] hover:bg-[var(--bd)] hover:text-[var(--fg)]'\n          }`}\n          title={t('templatesTab')}\n        >\n          <span className=\"text-sm leading-none\">❖<\/span>\n          <span className=\"truncate\">{t('templatesTab')}<\/span>\n        <\/button>\n\n        <button\n          onClick={() => handleTabClick('photos')}\n          className={`w-12 h-11 flex flex-col items-center justify-center rounded-xl text-[10px] gap-0.5 transition-all ${\n            isOpen && activeTab === 'photos'\n              ? 'bg-[var(--ac)] text-[var(--acf)] font-bold shadow-sm'\n              : 'text-[var(--mut)] hover:bg-[var(--bd)] hover:text-[var(--fg)]'\n          }`}\n          title={t('photosTab')}\n        >\n          <span className=\"text-sm leading-none\">🖼️<\/span>\n          <span className=\"truncate\">{t('photosTab')}<\/span>\n        <\/button>\n\n        <button\n          onClick={() => handleTabClick('elements')}\n          className={`w-12 h-11 flex flex-col items-center justify-center rounded-xl text-[10px] gap-0.5 transition-all ${\n            isOpen && activeTab === 'elements'\n              ? 'bg-[var(--ac)] text-[var(--acf)] font-bold shadow-sm'\n              : 'text-[var(--mut)] hover:bg-[var(--bd)] hover:text-[var(--fg)]'\n          }`}\n          title={t('elementsTab')}\n        >\n          <span className=\"text-sm leading-none\">⬚<\/span>\n          <span className=\"truncate\">{t('elementsTab')}<\/span>\n        <\/button>\n\n        <button\n          onClick={() => handleTabClick('typography')}\n          className={`w-12 h-11 flex flex-col items-center justify-center rounded-xl text-[10px] gap-0.5 transition-all ${\n            isOpen && activeTab === 'typography'\n              ? 'bg-[var(--ac)] text-[var(--acf)] font-bold shadow-sm'\n              : 'text-[var(--mut)] hover:bg-[var(--bd)] hover:text-[var(--fg)]'\n          }`}\n          title={t('typographyTab')}\n        >\n          <span className=\"text-sm leading-none\">T<\/span>\n          <span className=\"truncate\">{t('typographyTab')}<\/span>\n        <\/button>\n\n        <button\n          onClick={() => handleTabClick('iconsFonts')}\n          className={`w-12 h-11 flex flex-col items-center justify-center rounded-xl text-[10px] gap-0.5 transition-all ${\n            isOpen && activeTab === 'iconsFonts'\n              ? 'bg-[var(--ac)] text-[var(--acf)] font-bold shadow-sm'\n              : 'text-[var(--mut)] hover:bg-[var(--bd)] hover:text-[var(--fg)]'\n          }`}\n          title={t('iconsFontsTab')}\n        >\n          <span className=\"text-sm leading-none\">✦<\/span>\n          <span className=\"truncate\">{isAr ? 'أيقونات' : 'Icons'}<\/span>\n        <\/button>\n\n        <button\n          onClick={() => handleTabClick('layers')}\n          className={`w-12 h-11 flex flex-col items-center justify-center rounded-xl text-[10px] gap-0.5 transition-all ${\n            isOpen && activeTab === 'layers'\n              ? 'bg-[var(--ac)] text-[var(--acf)] font-bold shadow-sm'\n              : 'text-[var(--mut)] hover:bg-[var(--bd)] hover:text-[var(--fg)]'\n          }`}\n          title={t('layersTab')}\n        >\n          <span className=\"text-sm leading-none\">☰<\/span>\n          <span className=\"truncate\">{t('layersTab')}<\/span>\n        <\/button>\n\n        <button\n          onClick={() => handleTabClick('pages')}\n          className={`w-12 h-11 flex flex-col items-center justify-center rounded-xl text-[10px] gap-0.5 transition-all ${\n            isOpen && activeTab === 'pages'\n              ? 'bg-[var(--ac)] text-[var(--acf)] font-bold shadow-sm'\n              : 'text-[var(--mut)] hover:bg-[var(--bd)] hover:text-[var(--fg)]'\n          }`}\n          title={isAr ? 'إدارة الصفحات والماستر' : 'Pages & Masters'}\n        >\n          <span className=\"text-sm leading-none\">▤<\/span>\n          <span className=\"truncate\">{isAr ? 'الصفحات' : 'Pages'}<\/span>\n        <\/button>\n\n        <button\n          onClick={() => handleTabClick('projects')}\n          className={`w-12 h-11 flex flex-col items-center justify-center rounded-xl text-[10px] gap-0.5 transition-all ${\n            isOpen && activeTab === 'projects'\n              ? 'bg-[var(--ac)] text-[var(--acf)] font-bold shadow-sm'\n              : 'text-[var(--mut)] hover:bg-[var(--bd)] hover:text-[var(--fg)]'\n          }`}\n          title={t('projectsTab')}\n        >\n          <span className=\"text-sm leading-none\">💾<\/span>\n          <span className=\"truncate\">{isAr ? 'مشاريعي' : 'Files'}<\/span>\n        <\/button>\n\n        <div className=\"mt-auto flex flex-col gap-1 items-center\">\n          {/* Toggle / Retract button */}\n          <button\n            onClick={onToggle}\n            className=\"w-9 h-9 flex items-center justify-center rounded-xl hover:bg-[var(--bd)] text-xs text-[var(--mut)] transition-transform duration-200\"\n            title={isOpen ? (isAr ? 'طي الشريط للداخل' : 'Slide Inside') : (isAr ? 'إخراج الشريط' : 'Slide Out')}\n          >\n            {isOpen ? (isAr ? '›' : '‹') : (isAr ? '‹' : '›')}\n          <\/button>\n        <\/div>\n      <\/div>\n\n      {/* Main Drawer Content - Smooth slide in and retract */}\n      <div\n        className={`h-full flex flex-col overflow-hidden transition-all duration-300 ease-in-out ${\n          isOpen\n            ? 'w-[min(72vw,20rem)] md:w-80 opacity-100 pointer-events-auto'\n            : 'w-0 opacity-0 pointer-events-none'\n        }`}\n      >\n        <div className=\"w-[min(72vw,20rem)] md:w-80 h-full flex flex-col overflow-hidden shrink-0\">\n        {/* Tab 1: Templates (قوالب) */}\n        {activeTab === 'templates' && (\n          <div className=\"flex-1 flex flex-col overflow-hidden p-3 space-y-3\">\n            <div className=\"flex items-center justify-between\">\n              <span className=\"font-bold text-xs\">{isAr ? 'مكتبة القوالب الاحترافية' : 'Template Catalog'}<\/span>\n              <div className=\"flex items-center gap-1.5\">\n                <button\n                  onClick={onOpenDeveloperStudio}\n                  className=\"text-[10px] font-bold text-blue-600 bg-blue-500/10 px-2 py-0.5 rounded-md hover:bg-blue-500/20\"\n                  title=\"إدارة قوالب المطور\"\n                >\n                  👑 {t('devTemplates')}\n                <\/button>\n                <button\n                  onClick={onToggle}\n                  className=\"w-6 h-6 flex items-center justify-center rounded-lg hover:bg-[var(--bd)] text-xs text-[var(--mut)]\"\n                  title={isAr ? 'طي الشريط للداخل' : 'Collapse drawer'}\n                >\n                  ✕\n                <\/button>\n              <\/div>\n            <\/div>\n\n            {/* Category pills */}\n            <div className=\"flex gap-1.5 overflow-x-auto pb-1 scrollbar-none\">\n              {TEMPLATE_CATEGORIES.map((cat) => (\n                <button\n                  key={cat.id}\n                  onClick={() => setSelectedCategory(cat.id)}\n                  className={`px-2.5 py-1 rounded-lg text-xs whitespace-nowrap transition-colors ${\n                    selectedCategory === cat.id\n                      ? 'bg-[var(--ac)] text-[var(--acf)] font-semibold'\n                      : 'bg-[var(--row)] text-[var(--mut)] hover:text-[var(--fg)]'\n                  }`}\n                >\n                  {cat.icon} {cat.name}\n                <\/button>\n              ))}\n            <\/div>\n\n            {/* Template Cards */}\n            <div className=\"flex-1 overflow-y-auto space-y-2.5 pr-0.5\">\n              {/* Show Developer Templates in this category if any */}\n              {devTemplates\n                .filter((d) => d.category === selectedCategory || selectedCategory === 'custom')\n                .map((devTmpl) => (\n                  <div\n                    key={devTmpl.id}\n                    onClick={() => {\n                      onApplyTemplate(devTmpl.items);\n                      toast(`تم تطبيق ${devTmpl.title}`);\n                    }}\n                    className=\"p-3 rounded-xl border border-blue-500/30 bg-blue-500/5 hover:bg-blue-500/10 cursor-pointer transition-all group\"\n                  >\n                    <div className=\"flex items-center justify-between mb-1\">\n                      <span className=\"font-bold text-xs text-[var(--fg)]\">{devTmpl.title}<\/span>\n                      <span className=\"text-[9px] px-1.5 py-0.2 rounded bg-blue-600 text-white font-semibold\">\n                        قالب معتمد 👑\n                      <\/span>\n                    <\/div>\n                    <div className=\"text-[11px] text-[var(--mut)] line-clamp-2\">{devTmpl.description}<\/div>\n                  <\/div>\n                ))}\n\n              {TEMPLATE_CATEGORIES.find((c) => c.id === selectedCategory)?.items.map((tmpl) => (\n                <div\n                  key={tmpl.id}\n                  onClick={() => {\n                    const generated = tmpl.generator(doc.w, doc.h);\n                    onApplyTemplate(generated);\n                    toast(`تم تطبيق ${tmpl.title}`);\n                  }}\n                  className=\"p-3 rounded-xl border border-[var(--bd)] hover:border-[var(--ac)] bg-[var(--row)] hover:bg-[var(--bd)] cursor-pointer transition-all group\"\n                >\n                  <div\n                    className=\"h-24 rounded-lg mb-2 flex items-center justify-center text-xs font-bold text-white shadow-inner p-2 text-center\"\n                    style={{ background: tmpl.previewBg }}\n                  >\n                    <span>{tmpl.title}<\/span>\n                  <\/div>\n                  <div className=\"font-semibold text-xs text-[var(--fg)]\">{tmpl.title}<\/div>\n                  <div className=\"text-[11px] text-[var(--mut)] line-clamp-2 mt-0.5 leading-relaxed\">\n                    {tmpl.description}\n                  <\/div>\n                  <div className=\"mt-2 text-[10px] text-[var(--ac)] font-bold group-hover:underline\">\n                    {isAr ? 'تطبيق على الصفحة الحالية ←' : 'Apply to page ←'}\n                  <\/div>\n                <\/div>\n              ))}\n            <\/div>\n          <\/div>\n        )}\n\n        {/* Tab 2: Photos & Media (صور) */}\n        {activeTab === 'photos' && (\n          <div className=\"flex-1 flex flex-col overflow-hidden p-3 space-y-3\">\n            <div className=\"flex items-center justify-between\">\n              <span className=\"font-bold text-xs\">{isAr ? 'مكتبة الصور والوسائط' : 'Stock Photos & Media'}<\/span>\n              <button\n                onClick={onUploadImageClick}\n                className=\"ps-btn ps-btn-primary text-[10px] py-1 px-2.5 font-bold\"\n              >\n                + {t('uploadFromDevice')}\n              <\/button>\n            <\/div>\n\n            {/* Search Input for Photos */}\n            <input\n              type=\"text\"\n              placeholder={t('searchPhotosPlaceholder')}\n              value={photoSearch}\n              onChange={(e) => setPhotoSearch(e.target.value)}\n              className=\"ps-input w-full text-xs\"\n            />\n\n            {/* Photo Category Pills */}\n            <div className=\"flex gap-1 overflow-x-auto pb-1 scrollbar-none text-[11px]\">\n              {[\n                { id: 'all', label: t('photoCatAll') },\n                { id: 'celebrities', label: t('photoCatCelebrities') },\n                { id: 'business', label: t('photoCatBusiness') },\n                { id: 'architecture', label: t('photoCatArchitecture') },\n                { id: 'food', label: t('photoCatFood') },\n                { id: 'textures', label: t('photoCatTextures') },\n              ].map((c) => (\n                <button\n                  key={c.id}\n                  onClick={() => setPhotoCategory(c.id)}\n                  className={`px-2 py-0.5 rounded-md whitespace-nowrap ${\n                    photoCategory === c.id\n                      ? 'bg-[var(--ac)] text-[var(--acf)] font-semibold'\n                      : 'bg-[var(--row)] text-[var(--mut)]'\n                  }`}\n                >\n                  {c.label}\n                <\/button>\n              ))}\n            <\/div>\n\n            {/* Photos Grid */}\n            <div className=\"flex-1 overflow-y-auto grid grid-cols-2 gap-2 pr-0.5\">\n              {filteredPhotos.map((photo) => (\n                <div\n                  key={photo.id}\n                  onClick={() => handleAddStockPhoto(photo)}\n                  className=\"rounded-xl overflow-hidden border border-[var(--bd)] hover:border-[var(--ac)] bg-[var(--row)] cursor-pointer group flex flex-col\"\n                >\n                  <div className=\"h-24 bg-neutral-900 overflow-hidden relative\">\n                    <img\n                      src={photo.url}\n                      alt={photo.title}\n                      referrerPolicy=\"no-referrer\"\n                      className=\"w-full h-full object-cover group-hover:scale-105 transition-transform duration-200\"\n                    />\n                    <div className=\"absolute inset-0 bg-black/20 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center text-[10px] text-white font-bold\">\n                      + {isAr ? 'إدراج' : 'Insert'}\n                    <\/div>\n                  <\/div>\n                  <div className=\"p-1.5 text-[11px] font-semibold text-[var(--fg)] truncate\">\n                    {isAr ? photo.title : photo.titleEn}\n                  <\/div>\n                <\/div>\n              ))}\n            <\/div>\n          <\/div>\n        )}\n\n        {/* Tab 3: Elements & Shapes (عناصر) */}\n        {activeTab === 'elements' && (\n          <div className=\"flex-1 overflow-y-auto p-3 space-y-4\">\n            <div>\n              <span className=\"font-bold text-xs block mb-2\">{isAr ? 'أشكال هندسية وإطارات' : 'Shapes & Frames'}<\/span>\n              <div className=\"grid grid-cols-2 gap-2\">\n                <button\n                  onClick={() =>\n                    onAddItem({\n                      type: 'rect',\n                      w: doc.w * 0.4,\n                      h: doc.h * 0.12,\n                      color: '#1b2f6b',\n                    })\n                  }\n                  className=\"p-2.5 rounded-xl bg-[var(--row)] hover:bg-[var(--bd)] border border-[var(--bd)] text-xs flex flex-col items-center gap-1.5\"\n                >\n                  <span className=\"w-8 h-5 bg-[#1b2f6b] rounded-sm block\" />\n                  <span>{isAr ? 'مستطيل ملون' : 'Rectangle'}<\/span>\n                <\/button>\n\n                <button\n                  onClick={() =>\n                    onAddItem({\n                      type: 'ell',\n                      w: 120,\n                      h: 120,\n                      color: '#0284c7',\n                    })\n                  }\n                  className=\"p-2.5 rounded-xl bg-[var(--row)] hover:bg-[var(--bd)] border border-[var(--bd)] text-xs flex flex-col items-center gap-1.5\"\n                >\n                  <span className=\"w-6 h-6 bg-[#0284c7] rounded-full bloc           }\n              className=\"w-full p-2.5 rounded-xl bg-[var(--row)] hover:bg-[var(--bd)] border border-[var(--bd)] text-right group\"\n            >\n              <span className=\"font-bold text-xs block font-['Amiri'] text-[var(--fg)]\">\n                {isAr ? 'اقتباس تحريري' : 'Editorial Quote'}\n              <\/span>\n              <span className=\"text-[10px] text-[var(--mut)]\">Amiri 18pt<\/span>\n            <\/button>\n          <\/div>\n        )}\n\n        {/* Tab 5: Icons & Fonts (أيقونات وخطوط) */}\n        {activeTab === 'iconsFonts' && (\n          <div className=\"flex-1 flex flex-col overflow-hidden p-3 space-y-3\">\n            <span className=\"font-bold text-xs\">{isAr ? 'مكتبة الأيقونات والخطوط' : 'Icons & Font Hub'}<\/span>\n\n            {/* Custom Google Font Loader */}\n            <div className=\"p-2.5 rounded-xl bg-[var(--row)] border border-[var(--bd)] space-y-2\">\n              <span className=\"text-[11px] font-bold text-[var(--fg)] block\">{t('addCustomFont')}<\/span>\n              <div className=\"flex gap-1.5\">\n                <input\n                  type=\"text\"\n                  placeholder={t('fontNamePlaceholder')}\n                  value={customFontInput}\n                  onChange={(e) => setCustomFontInput(e.target.value)}\n                  className=\"ps-input flex-1 text-xs\"\n                />\n                <button\n                  onClick={async () => {\n                    if (!customFontInput.trim()) return;\n                    toast(isAr ? 'جارٍ تحميل الخط...' : 'Loading font...');\n                    const ok = await loadGoogleFont(customFontInput.trim());\n                    if (ok) {\n                      toast(isAr ? `تم تثبيت خط ${customFontInput} بنجاح!` : `Installed ${customFontInput}!`);\n                      setCustomFontInput('');\n                    } else {\n                      toast(isAr ? 'تعذر تحميل الخط، تحقق من الاسم' : 'Failed to load font');\n         toast(isAr ? 'تمت إضافة طبقة شكل/مستطيل ▭' : 'Added shape layer ▭');\n                  }}\n                  className=\"px-2 py-0.5 rounded-lg bg-[var(--bar)] hover:bg-[var(--bd)] text-[11px] font-medium border border-[var(--bd)] shrink-0\"\n                  title={isAr ? 'إضافة طبقة شكل/مستطيل' : 'Add shape layer'}\n                >\n                  ▭ {isAr ? 'مستطيل' : 'Shape'}\n                <\/button>\n\n                <button\n                  onClick={() => {\n                    const rad = Math.min(doc.w, doc.h) * 0.3;\n                    onAddItem({\n                      type: 'ell',\n                      w: rad,\n                      h: rad,\n                      color: '#0284c7',\n                      name: isAr ? 'طبقة دائرة' : 'Circle Layer',\n                    });\n                    toast(isAr ? 'تمت إضافة طبقة دائرة ◯' : 'Added circle layer ◯');\n                  }}\n                  className=\"px-2 py-0.5 rounded-lg bg-[var(--bar)] hover:bg-[var(--bd)] text-[11px] font-medium border border-[var(--bd)] shrink-0\"\n                  title={isAr ? 'إضافة طبقة دائرة' : 'Add circle layer'}\n                >\n                  ◯ {isAr ? 'دائرة' : 'Circle'}\n                <\/button>\n\n                <button\n                  onClick={onUploadImageClick}\n                  className=\"px-2 py-0.5 rounded-lg bg-[var(--bar)] hover:bg-[var(--bd)] text-[11px] font-medium border border-[var(--bd)] shrink-0 text-blue-600 font-bold\"\n                  title={isAr ? 'إدراج صورة كطبقة جديدة' : 'Add image layer'}\n                >\n                  🖼️ {isAr ? 'صورة' : 'Image'}\n                <\/button>\n              <\/div>\n            <\/div>\n\n            {/* Layers List */}\n            <div className=\"flex-1 overflow-y-auto space-y-1.5 py-1\">\n              {currentPageItems.length === 0 ? (\n                <div className=\"text-xs text-[var(--mut)] text-center py-8 space-y-2\">\n                  <div>{isAr ? 'لا تو                   <span\n                          onDoubleClick={() => {\n                            setEditingLayerId(item.id);\n                            setEditingLayerName(item.name || item.text || `عنصر #${item.id}`);\n                          }}\n                          className=\"truncate max-w-[100px] sm:max-w-[120px]\"\n                          title={isAr ? 'انقر مرتين لإعادة تسمية الطبقة' : 'Double click to rename'}\n                        >\n                          {item.name || (item.type === 'text' ? (item.text || 'نص').substring(0, 16) : `${item.type} #${item.id}`)}\n                        <\/span>\n                      )}\n\n                      {item.groupId && (\n                        <span\n                          onClick={(e) => {\n                            e.stopPropagation();\n                            handleUngroup(item.id);\n                          }}\n                          className=\"text-[9px] px-1 py-0.2 rounded bg-amber-500/10 text-amber-600 font-bold\"\n                          title={isAr ? 'انقر لفك التجميع' : 'Click to ungroup'}\n                        >\n                          مجموعة ✕\n                        <\/span>\n                      )}\n                    <\/div>\n\n                    {/* Layer Controls: Reorder, Duplicate, Lock, Hide, DELETE */}\n                    <div className=\"flex items-center gap-0.5 shrink-0\" onClick={(e) => e.stopPropagation()}>\n                      {/* Move Up */}\n                      <button\n                        onClick={() => moveLayer(item.id, 'up')}\n                        className=\"p-1 hover:bg-[var(--bd)] rounded text-[10px]\"\n                        title={isAr ? 'للأعلى' : 'Move Up'}\n                      >\n                        ▲\n                      <\/button>\n                      {/* Move Down */}\n                      <button\n                        onClick={() => moveLayer(item.id, 'down')}\n                        className utton */}\n                      <button\n                        onClick={() => onDeleteItem(item.id)}\n                        className=\"p-1 rounded text-xs text-rose-500 hover:bg-rose-500/15 transition-colors\"\n                        title={isAr ? 'حذف هذه الطبقة نهائياً 🗑️' : 'Delete this layer 🗑️'}\n                      >\n                        🗑️\n                      <\/button>\n                    <\/div>\n                  <\/div>\n                ))\n              )}\n            <\/div>\n          <\/div>\n        )}\n\n        {/* Tab 7: Projects & Auto-Save (مشاريعي) */}\n        {activeTab === 'projects' && (\n          <div className=\"flex-1 overflow-y-auto p-3 space-y-4\">\n            <div className=\"p-3 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-xs text-emerald-600 space-y-1\">\n              <div className=\"flex items-center gap-1.5 font-bold\">\n                <span className=\"w-2 h-2 rounded-full bg-emerald-500 animate-pulse\" />\n                <span>{t('autoSaveActive')}<\/span>\n              <\/div>\n              <div className=\"text-[11px] opacity-80\">{t('lastSaved', { time: lastAutoSavedTime })}<\/div>\n            <\/div>\n\n            <div className=\"p-3 rounded-xl bg-[var(--row)] border border-[var(--bd)] space-y-2\">\n              <div className=\"font-bold text-xs text-[var(--fg)]\">\n                {isAr ? 'الحفظ على الهاتف والكمبيوتر' : 'Save to Phone & PC'}\n              <\/div>\n              <button onClick={onExportMobileFile} className=\"ps-btn ps-btn-primary w-full py-1.5 text-xs font-bold\">\n                📲 {isAr ? 'حفظ نسخة المشروع على الجهاز' : 'Export Project File'}\n              <\/button>\n            <\/div>\n\n            <div className=\"space-y-2\">\n              <span className=\"font-bold text-xs block\">{isAr ? 'حفظ المشروع باسم جديد' : 'Save Project As'}<\/span>\n              <div className=\"flex gap-2\">\n                <input\n                  type=\"text\"\n utter, setGutter] = useState(4); // in mm\n\n  // Margins State (in mm)\n  const [marginTop, setMarginTop] = useState(12);\n  const [marginBottom, setMarginBottom] = useState(12);\n  const [marginInside, setMarginInside] = useState(15);\n  const [marginOutside, setMarginOutside] = useState(12);\n  const [linkMargins, setLinkMargins] = useState(false);\n\n  const updateAllMargins = (val: number) => {\n    setMarginTop(val);\n    setMarginBottom(val);\n    setMarginInside(val);\n    setMarginOutside(val);\n  };\n\n  const applyPreset = (preset: typeof PRESETS[0]) => {\n    setSizeKey(preset.size);\n    setW(preset.w);\n    setH(preset.h);\n    setIntent(preset.intent);\n    setFacingPages(preset.facing);\n    setBleed(preset.bleed);\n    if (preset.size === 'Poster') {\n      setColumns(4);\n      setGutter(5);\n    } else if (preset.size === 'A4') {\n      setColumns(3);\n      setGutter(4);\n    } else if (preset.size === 'Card') {\n      setColumns(1);\n      setGutter(0);\n    } else {\n      setColumns(2);\n      setGutter(4);\n    }\n    if (preset.intent === 'print') setColorMode('CMYK');\n    else setColorMode('RGB');\n  };\n\n  const handleCreate = () => {\n    const pages = Array.from({ length: Math.max(1, pagesCount) }, (_, i) => ({\n      id: `p-${i + 1}-${Date.now()}`,\n      m: '',\n      items: [],\n    }));\n\n    const newDoc: DocData = {\n      name,\n      w,\n      h,\n      size: sizeKey,\n      intent,\n      colorMode,\n      facingPages,\n      binding,\n      bleed,\n      margins: {\n        top: Math.max(0, marginTop),\n        bottom: Math.max(0, marginBottom),\n        inside: Math.max(0, marginInside),\n        outside: Math.max(0, marginOutside),\n      },\n      columns: Math.max(1, columns),\n      gutter: Math.max(0, gutter),\n      showGrid: true,\n      pages,\n      masters: { A: [], B: [] },\n    };\n\n    onConfirm(newDoc);\n  };\n\n  return (\n    <div className=\"sheet-backdrop z-50 flex items-center justify-center p-3\">\n
